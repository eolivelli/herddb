          if-no-files-found: ignore

  test-services:
    name: HerdDB Services tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
