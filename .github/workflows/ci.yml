name: Java CI
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  MAVEN_OPTS: -Dmaven.artifact.threads=4 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn  -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3
jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Cache Maven packages'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: 'cache'
          restore-keys: 'cache'
      - name: 'Cache Node toolchain'
        # frontend-maven-plugin installs Node/npm to ~/.cache/frontend-maven-plugin
        # (outside target/ so it is not wiped by mvn clean). Caching that
        # directory avoids re-downloading the Node tarball on every CI run.
        # The key includes the pom.xml hash so bumping nodeVersion or npmVersion
        # automatically busts the cache.
        uses: actions/cache@v4
        with:
          path: ~/.cache/frontend-maven-plugin
          key: node-toolchain-${{ runner.os }}-${{ hashFiles('herddb-ui/pom.xml') }}
          restore-keys: node-toolchain-${{ runner.os }}-
      - name: 'Checkout jvector'
        uses: actions/checkout@v4
        with:
          repository: eolivelli/jvector
          ref: main
          path: jvector
      - name: 'Build jvector'
        run: mvn -B install -DskipTests -Drat.skip=true --file jvector/pom.xml && rm -rf jvector
      # BookKeeper temporary SNAPSHOT — see issue #435.
      # The fork carries fixes that have not shipped in any released 4.17.x
      # (PendingAddOp leak + ConcurrentLongHashMap record/JDK-25 issue).
      # circe-checksum bundles a Lombok 1.18.30 annotation processor which
      # cannot run on JDK 25 (TypeTag :: UNKNOWN), so we build BookKeeper on
      # JDK 17 and then switch back to JDK 25 for the HerdDB build.
      - name: 'Checkout bookkeeper (eolivelli fork)'
        uses: actions/checkout@v4
        with:
          repository: eolivelli/bookkeeper
          ref: fix-concurrentlonghashmap-record-4.17
          path: bookkeeper
      - name: 'Set up JDK 17 (for BookKeeper build only)'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 'Build bookkeeper'
        run: mvn -B install -DskipTests -Drat.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true --file bookkeeper/pom.xml && rm -rf bookkeeper
      - name: 'Set up JDK 25 (restore for HerdDB build)'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Build with Maven (with checkstyle, rat, spotbugs)'
        run: mvn -B checkstyle:check apache-rat:check install -DskipTests spotbugs:check -Dmaven.test.redirectTestOutputToFile=true -Dherddb.file.requirefsync=false --file pom.xml -Pci
      - name: 'Upload build artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-artifacts
          path: |
            ~/.m2/repository/org/herddb
            ~/.m2/repository/io/github/jbellis
            ~/.m2/repository/org/apache/bookkeeper
          retention-days: 1
      - name: 'Remove Snapshots Before Caching'
        # Strip every *SNAPSHOT* dir from the cache so the next CI run rebuilds
        # both jvector and the eolivelli BookKeeper fork from source. Test jobs
        # still get the SNAPSHOT artifacts via the upload/download-artifact
        # round-trip above.
        run: find ~/.m2 -name '*SNAPSHOT' | xargs rm -Rf

  test-core:
    name: HerdDB Core tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Cache Maven packages'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: 'cache'
          restore-keys: 'cache'
      - name: 'Download build artifacts'
        uses: actions/download-artifact@v4
        with:
          name: maven-build-artifacts
          path: ~/.m2/repository
      - name: 'Test herddb-core (non-cluster)'
        run: mvn -B verify -DforkCount=2 -Dtest.excludedGroups=herddb.core.ClusterTest -Dmaven.test.redirectTestOutputToFile=true -Dherddb.file.requirefsync=false --file pom.xml -pl herddb-core -Pci
      - name: 'Upload surefire reports'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-core
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          retention-days: 7
          if-no-files-found: ignore

  test-cluster:
    name: HerdDB Core Cluster tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Cache Maven packages'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: 'cache'
          restore-keys: 'cache'
      - name: 'Download build artifacts'
        uses: actions/download-artifact@v4
        with:
          name: maven-build-artifacts
          path: ~/.m2/repository
      - name: 'Test herddb-core (cluster)'
        run: mvn -B verify -DforkCount=2 -Dtest.groups=herddb.core.ClusterTest -Dmaven.test.redirectTestOutputToFile=true -Dherddb.file.requirefsync=false --file pom.xml -pl herddb-core -Pci
      - name: 'Upload surefire reports'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-cluster
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          retention-days: 7
          if-no-files-found: ignore

  test-other:
    name: Other modules tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Cache Maven packages'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: 'cache'
          restore-keys: 'cache'
      - name: 'Cache Node toolchain'
        # frontend-maven-plugin installs Node/npm to ~/.cache/frontend-maven-plugin
        # (outside target/ so it is not wiped by mvn clean). Caching that
        # directory avoids re-downloading the Node tarball on every CI run.
        # The key includes the pom.xml hash so bumping nodeVersion or npmVersion
        # automatically busts the cache.
        uses: actions/cache@v4
        with:
          path: ~/.cache/frontend-maven-plugin
          key: node-toolchain-${{ runner.os }}-${{ hashFiles('herddb-ui/pom.xml') }}
          restore-keys: node-toolchain-${{ runner.os }}-
      - name: 'Download build artifacts'
        uses: actions/download-artifact@v4
        with:
          name: maven-build-artifacts
          path: ~/.m2/repository
      - name: 'Test other modules'
        run: mvn -B verify -Dmaven.test.redirectTestOutputToFile=true -Dherddb.file.requirefsync=false --file pom.xml -Pci -pl !herddb-core,!herddb-remote-file-service,!herddb-indexing-service,!herddb-services
      - name: 'Upload surefire reports'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-other
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          retention-days: 7
          if-no-files-found: ignore

  test-remote-file-service:
