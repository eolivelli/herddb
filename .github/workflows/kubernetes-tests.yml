name: Java CI - Kubernetes tests
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  MAVEN_OPTS: -Dmaven.artifact.threads=4 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn  -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Cache Maven packages'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: 'cache'
          restore-keys: 'cache'
      - name: 'Checkout jvector'
        uses: actions/checkout@v4
        with:
          repository: eolivelli/jvector
          # Pinned to the parallel-fusedpq-io PR branch (issue #547) while
          # eolivelli/jvector#8 is unmerged. Revert to ref: main once merged.
          ref: parallel-fusedpq-io
          path: jvector
      - name: 'Build jvector'
        run: mvn -B install -DskipTests -Drat.skip=true --file jvector/pom.xml && rm -rf jvector
      # BookKeeper temporary SNAPSHOT — see issue #435.
      # See ci.yml for why the build runs on JDK 17.
      - name: 'Checkout bookkeeper (eolivelli fork)'
        uses: actions/checkout@v4
        with:
          repository: eolivelli/bookkeeper
          ref: fix-concurrentlonghashmap-record-4.17
          path: bookkeeper
      - name: 'Set up JDK 17 (for BookKeeper build only)'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 'Build bookkeeper'
        run: mvn -B install -DskipTests -Drat.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Dlicense.skip=true --file bookkeeper/pom.xml && rm -rf bookkeeper
      - name: 'Set up JDK 25 (restore for HerdDB build)'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
      - name: 'Build with Maven'
        run: mvn -B install -DskipTests --file pom.xml -Pci
      - name: 'Build docker images'
        run: mvn -B -pl herddb-docker --file pom.xml package -Ddocker
      - name: 'Install Helm'
        uses: azure/setup-helm@v4
      - name: 'Install helm-unittest plugin'
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git
      - name: 'Helm lint'
        run: helm lint herddb-kubernetes/src/main/helm/herddb
      - name: 'Helm unit tests'
        run: helm unittest herddb-kubernetes/src/main/helm/herddb
      - name: 'Run Kubernetes tests'
        run: mvn -B verify -pl herddb-kubernetes --file pom.xml -Pkubernetes
      # Upload surefire/failsafe reports + any hs_err / heap dumps on failure
      # so we can inspect the on-disk diagnostics produced by the K3s ITs
      # (issue #438). The TestWatcher rule streams `kubectl exec jstack`,
      # `jcmd VM.native_memory summary`, `dmesg`, and pod logs into the test
      # output, which surefire writes into target/surefire-reports/*-output.txt.
      - name: 'Upload Kubernetes test reports'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-test-reports
          path: |
            herddb-kubernetes/target/surefire-reports/**
            herddb-kubernetes/target/failsafe-reports/**
            **/hs_err_pid*.log
            **/heapdump*.hprof
          retention-days: 7
          if-no-files-found: ignore
      - name: 'Remove Snapshots Before Caching'
        run: find ~/.m2 -name '*SNAPSHOT' | xargs rm -Rf
