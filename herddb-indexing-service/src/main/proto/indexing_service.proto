syntax = "proto3";

option java_package = "herddb.indexing.proto";
option java_outer_classname = "IndexingServiceProto";
option java_multiple_files = true;

package indexing;

service IndexingService {
    rpc Search (SearchRequest) returns (SearchResponse);
    rpc GetIndexStatus (GetIndexStatusRequest) returns (GetIndexStatusResponse);

    // Diagnostic RPCs used by the indexing-admin CLI.
    rpc ListIndexes (ListIndexesRequest) returns (ListIndexesResponse);
    rpc DescribeIndex (DescribeIndexRequest) returns (DescribeIndexResponse);
    rpc ListPrimaryKeys (ListPrimaryKeysRequest) returns (stream PrimaryKeysChunk);
    rpc GetEngineStats (GetEngineStatsRequest) returns (GetEngineStatsResponse);
    rpc GetInstanceInfo (GetInstanceInfoRequest) returns (GetInstanceInfoResponse);

    // Blocks server-side until the loaded index state has reached the target
    // LSN (or the timeout/deadline expires). Used for deterministic testing of
    // shadow replicas and for admin operations that need to wait for catch-up.
    rpc WaitForCheckpoint (WaitForCheckpointRequest) returns (WaitForCheckpointResponse);

    // Returns whether this instance is a shadow replica and its catch-up state.
    rpc GetShadowStatus (GetShadowStatusRequest) returns (GetShadowStatusResponse);

    // Issue #509: eager DROP cleanup trigger. The HerdDB server calls this
    // when DROP TABLE / DROP INDEX is executed so the IS immediately begins
    // background cleanup of the ZK segment registry and file-server data for
    // the named index, without waiting for the commit-log tailer to catch up.
    // Best-effort from the caller's side: old IS pods that do not yet implement
    // this RPC return UNIMPLEMENTED, which the client treats as a warning.
    // The commit-log tailer path remains the authoritative cleanup fallback.
    rpc DropIndex (DropIndexRequest) returns (DropIndexResponse);

    // Issue #617: operator remediation tool. Removes a single corrupted /
    // partially-written segment from the IS in-memory metadata so the
    // compaction loop stops re-selecting it after a Phase B upload failure
    // left the segment registered without a fully-written graph file.
    //
    // SAFETY: by default the IS refuses to delete a segment whose graph file
    // IS reachable in remote storage (operator may be targeting the wrong
    // segment). Set force=true to override. When purge_storage=true the IS
    // also deletes the segment's multipart graph + map files from the
    // underlying DataStorageManager. After a successful deletion the IS
    // re-publishes its IndexingServiceCheckpointState so shadow replicas
    // observe the new (smaller) segment set on their next reload.
    rpc DeleteSegment (DeleteSegmentRequest) returns (DeleteSegmentResponse);

    // Push-based indexing (TESTING ONLY). When the indexing service runs with
    // indexing.log.type=push it does NOT tail a file/BookKeeper commit log;
    // instead a client serializes herddb.log.LogEntry objects and pushes them
    // straight into a bounded in-memory buffer via this RPC. No HerdDB server
    // and no commit log are required.
    //
    // The call blocks server-side until every entry in the batch has been
    // accepted into the buffer — while a checkpoint/compaction stalls the
    // tailer the buffer fills and the call parks. Clients MUST therefore use
    // an infinite deadline. The client owns LSN assignment and MUST send
    // entries in strictly increasing LSN order (and, when feeding multiple
    // indexing-service instances, identically to every instance).
    rpc PushEntries (PushEntriesRequest) returns (PushEntriesResponse);
}

message SearchRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    repeated float vector = 4;
    int32 limit = 5;
    bool return_score = 6;
}

message SearchResult {
    bytes primary_key = 1;
    float score = 2;
}

message SearchResponse {
    repeated SearchResult results = 1;
}

message GetIndexStatusRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
}

message GetIndexStatusResponse {
    int64 vector_count = 1;
    int32 segment_count = 2;
    // In-memory tailer position: the LSN of the most recently applied log
    // entry. Updated on every tailer advance, BEFORE the underlying state is
    // durably persisted to remote storage. Used by WAITFORINDEXES (a
    // queryability gate: "have all entries through this LSN been applied to
    // in-memory state?") and by diagnostic tooling. Must NEVER be used as a
    // recovery floor or commit-log retention pin, because the IS cannot
    // start from this LSN after a restart unless a checkpoint has covered
    // it (issue #364).
    int64 tailer_lsn_ledger = 3;
    int64 tailer_lsn_offset = 4;
    string status = 5;
    // Durable recovery LSN: the LSN of the most recent checkpoint whose
    // watermark has been successfully written to remote storage. After a
    // restart, the IS will resume from this LSN. Server-side commit-log
    // retention MUST pin against this value (and not tailer_lsn_*) so it
    // never drops a ledger that the IS would need to replay on recovery
    // (issue #364). A {0,0} value means "no durable watermark yet" —
    // callers MUST treat that as LogSequenceNumber.START_OF_TIME.
    int64 durable_lsn_ledger = 6;
    int64 durable_lsn_offset = 7;
    // Cold-start recovery progress (issue #381). Both fields are 0 when the
    // index is not currently loading from disk. When loading,
    // loading_segments_total > 0 and loading_segments_done advances from 0
    // to loading_segments_total. Operators and the wait_for_indexes barrier
    // can use the ratio to estimate remaining recovery time.
    int32 loading_segments_done = 8;
    int32 loading_segments_total = 9;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the tailer LSN.
    // Operators compute the tailer time-lag as `now - tailer_lsn_timestamp`.
    // 0 means "unknown" (no entries processed yet). Issue #423.
    int64 tailer_lsn_timestamp = 10;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the durable LSN.
    // Operators compute the durable time-lag as `now - durable_lsn_timestamp`.
    // 0 means "unknown" (no successful checkpoint yet). Issue #423.
    int64 durable_lsn_timestamp = 11;
}

// ---- Diagnostic RPCs ----

message IndexDescriptor {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    int64 vector_count = 4;
    string status = 5;
    // Number of on-disk segments held by the vector index.
    // Populated from PersistentVectorStore.getSegmentCount() (issue #285).
    int32 segment_count = 6;
    // Cold-start recovery progress (issue #381). Both fields are 0 when not loading.
    int32 loading_segments_done = 7;
    int32 loading_segments_total = 8;
}

message ListIndexesRequest {
}

message ListIndexesResponse {
    repeated IndexDescriptor indexes = 1;
}

message DescribeIndexRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
}

message DescribeIndexResponse {
    IndexDescriptor basic = 1;
    int32 dimension = 2;
    string similarity = 3;
    int64 live_node_count = 4;
    int64 ondisk_node_count = 5;
    int32 segment_count = 6;
    int32 live_shard_count = 7;
    int64 estimated_memory_bytes = 8;
    int64 live_vectors_memory_bytes = 9;
    int64 ondisk_size_bytes = 10;
    bool dirty = 11;
    // In-memory tailer position (most recently applied log entry).
    // Diagnostic only — see the matching field on GetIndexStatusResponse.
    int64 tailer_lsn_ledger = 12;
    int64 tailer_lsn_offset = 13;
    bool fused_pq_enabled = 14;
    int32 m = 15;
    int32 beam_width = 16;
    bool persistent = 17;
    string store_class = 18;
    // Compaction progress (issue #80). compaction_phase is one of
    // "idle", "writing-graph", "compacting-graph", "uploading-segment".
    // "compacting-graph" (issue #640) covers the streaming-compaction
    // Phase B I/O loop driven by jvector's OnDiskGraphIndexCompactor —
    // a busy phase that used to read as "idle" because nothing surrounding
    // it flipped writingGraphActive/uploadingActive. compaction_progress
    // is an integer 0..100, or -1 when idle.
    string compaction_phase = 19;
    int32 compaction_progress = 20;
    int64 compaction_nodes_done = 21;
    int64 compaction_nodes_total = 22;
    int64 upload_bytes_done = 23;
    int64 upload_bytes_total = 24;
    // Global monotonic node-id counter (issue #256). int64 so it cannot
    // silently wrap after 2^31 ids are burned by ingest + compaction
    // reservations on a long-running cluster.
    int64 next_node_id = 25;
    // Durable recovery LSN: the LSN of the most recent checkpoint whose
    // watermark has been successfully persisted to remote storage. Same
    // semantics as the matching field on GetIndexStatusResponse (issue #364).
    int64 durable_lsn_ledger = 26;
    int64 durable_lsn_offset = 27;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the tailer LSN.
    // 0 = unknown. Issue #423.
    int64 tailer_lsn_timestamp = 28;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the durable LSN.
    // 0 = unknown. Issue #423.
    int64 durable_lsn_timestamp = 29;
    // Per-index `numShards` value from the CREATE VECTOR INDEX WITH clause
    // (Index.properties[numShards]). Controls within-instance HNSW
    // graph-bucket granularity. Defaults to 1 when not set on the index.
    // Issue #451 — exposed so operators can verify what sharding configuration
    // an index is actually running with from the admin CLI.
    int32 num_shards = 30;
    // In-memory footprint of the on-disk VectorSegment objects: the
    // pkData/pkOffsets/pkLengths arrays plus the BLink pk-to-ordinal trees,
    // snapshotted at segment registration time. Reported separately from
    // live_vectors_memory_bytes (issue #563) so operators can distinguish
    // genuine live-vector heap from on-disk segment overhead — the latter
    // grows with segment_count and does not shrink on checkpoint.
    int64 ondisk_segment_memory_bytes = 31;

    // Real-time compaction observability (issue #640). These fields are
    // updated continuously while a compaction cycle is active so the
    // describe-index API reflects the *current* cycle's I/O progress
    // instead of the stale terminal state of the previous one.
    //
    //  - compaction_batches_done / compaction_batches_total reflect the
    //    OnDiskGraphIndexCompactor.runBatchesWithBackpressure counter that
    //    the IS log prints as "Compaction I/O progress: X/Y batches".
    //  - compaction_cycle_id is a monotonic counter that bumps once per
    //    runCompactionCycle / checkpoint Phase B call; consumers can use
    //    it to detect that a new cycle has begun even if the other
    //    counters were still at 100% from the previous cycle.
    //  - compaction_input_segment_count is how many segments are being
    //    merged in the active cycle (0 on the checkpoint Phase B path,
    //    which folds live shards rather than merging on-disk segments).
    //  - compaction_input_vector_count is the total vector count of the
    //    input set.
    //  - compaction_elapsed_ms is the wall-clock milliseconds since the
    //    current cycle started (0 when idle).
    //  - compaction_running is true while a cycle holds the compaction
    //    or checkpoint Phase B lock. Mirrors what GetEngineStats now
    //    surfaces aggregated across all loaded stores.
    int64 compaction_batches_done = 32;
    int64 compaction_batches_total = 33;
    int64 compaction_cycle_id = 34;
    int32 compaction_input_segment_count = 35;
    int64 compaction_input_vector_count = 36;
    int64 compaction_elapsed_ms = 37;
    bool compaction_running = 38;

    // Issue #646 early-checkpoint observability.
    //
    //  - micro_segment_count is the number of currently-loaded segments whose
    //    live-node count is strictly below the configured
    //    indexing.vector.index.compaction.microsegment.max.nodes threshold.
    //    A growing value is a leading indicator of segment-count back-pressure
    //    caused by the min-live-vectors gate being bypassed under memory
    //    pressure (the BIGANN 200M scenario that motivated this issue).
    //  - memory_pressure_checkpoint_bypass_count is a monotonic counter that
    //    increments every time shouldTriggerMemoryPressureCheckpoint() forced
    //    a checkpoint past the min-live-vectors deferral gate. Operators can
    //    correlate spikes here with micro_segment_count growth.
    //  - early_checkpoint_fraction echoes the configured
    //    indexing.memory.vector.early.checkpoint.fraction (default 0.90 after
    //    issue #646; was an unconfigurable 0.70 before).
    int32 micro_segment_count = 39;
    int64 memory_pressure_checkpoint_bypass_count = 40;
    double early_checkpoint_fraction = 41;
}

message ListPrimaryKeysRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    int32 chunk_size = 4;
    bool include_ondisk = 5;
    int64 limit = 6;
}

message PrimaryKeysChunk {
    repeated bytes primary_keys = 1;
    bool last = 2;
}

message GetEngineStatsRequest {
}

// Tagged union for engine-stats values. Issue #463: the engine-stats RPC
// surface used to be a frozen schema of ~20 typed fields, so every new
// counter required a proto migration. The response is now a flat
// repeated list of (key, MetricValue) entries — adding a metric is just
// `addInt64(builder, "new_metric", value)` server-side.
message MetricValue {
    oneof kind {
        int64 int64_value = 1;
        double double_value = 2;
        bool bool_value = 3;
        string string_value = 4;
    }
}

message MetricEntry {
    string key = 1;
    MetricValue value = 2;
}

message GetEngineStatsResponse {
    // Ordered list of (key, MetricValue) pairs. The server emits them in a
    // deterministic, human-readable order so the indexing-admin CLI text
    // output stays stable across releases. Consumers MUST NOT assume any
    // particular subset of keys is always present — tests that need a
    // specific metric key should look it up by name, not by position.
    repeated MetricEntry metrics = 1;
}

message GetInstanceInfoRequest {
}

message GetInstanceInfoResponse {
    string instance_id = 1;
    string grpc_host = 2;
    int32 grpc_port = 3;
    string storage_type = 4;
    string data_dir = 5;
    int64 jvm_max_heap_bytes = 6;
    string tablespace_name = 7;
    string tablespace_uuid = 8;
    int32 instance_ordinal = 9;
    int32 num_instances = 10;
    // "primary" or "shadow".
    string role = 11;
    // For role=shadow, the instance_ordinal of the primary being shadowed.
    // Set to -1 for primaries.
    int32 shadow_of = 12;
}

// ---- Shadow-replica RPCs ----

message WaitForCheckpointRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    int64 target_ledger_id = 4;
    int64 target_offset = 5;
    // Hard upper bound on how long the server will block. If zero or negative
    // the server relies on the gRPC deadline of the call.
    int64 timeout_ms = 6;
}

message WaitForCheckpointResponse {
    // Current loaded LSN at the moment the server returned.
    int64 current_ledger_id = 1;
    int64 current_offset = 2;
    // True iff (current_ledger_id, current_offset) >= target at return time.
    bool reached = 3;
}

message GetShadowStatusRequest {
}

message GetShadowStatusResponse {
    // True when this instance is running as a shadow replica.
    bool is_shadow = 1;
    // instance_ordinal of the primary being shadowed; -1 for primaries.
    int32 shadow_of = 2;
    // True when the shadow has completed its first successful reload and is
    // serving queries. Always true for primaries.
    bool ready = 3;
    int64 loaded_ledger_id = 4;
    int64 loaded_offset = 5;
    // Latest LSN advertised by the primary via ZooKeeper. Set to -1/-1 if not
    // yet observed. For primaries this mirrors the loaded LSN.
    int64 primary_advertised_ledger_id = 6;
    int64 primary_advertised_offset = 7;
    int64 last_reload_timestamp_ms = 8;
    int64 reload_count = 9;
    // Minimum IndexStatus.generation currently loaded across every vector
    // store this shadow holds. Leaders aggregate the min across all
    // shadows to decide when compaction's pending-delete entries become
    // eligible for physical deletion. 0 when no vector store is loaded.
    int64 applied_index_status_generation = 10;
    // Wall-clock timestamp (epoch ms) of the LogEntry at loaded_ledger_id /
    // loaded_offset — the freshness of the data this shadow can serve. Picked
    // up from the primary's advertised
    // IndexingServiceCheckpointState.lastEntryTimestampMillis on every reload.
    // Operators compute the shadow data-staleness as
    // `now - loaded_entry_timestamp_ms`. 0 = unknown. Issue #423.
    int64 loaded_entry_timestamp_ms = 11;
}

// Issue #509: eagerly triggered DROP cleanup (see rpc DropIndex above).
message DropIndexRequest {
    // HerdDB tablespace UUID (same value as the IS's configured tablespace UUID).
    string tablespace = 1;
    // Table name — used together with index to compute the IS-internal store key
    // without consulting the SchemaTracker (which lives on the tailer thread).
    string table = 2;
    // Index name.
    string index = 3;
    // HerdDB catalog UUID of the specific index being dropped.  Used by the IS
    // as a safety gate: if the in-memory store's UUID already differs from this
    // value, the tailer has already processed both the DROP and a subsequent
    // CREATE_INDEX for the same (table, index) name — the new store must not be
    // removed.  Empty string means "unknown / pre-upgrade client" and the gate
    // is skipped (idempotent fallback, safe because the IS-side UUID check only
    // prevents false positives, never false negatives).
    string dropped_index_uuid = 4;
}

// Intentionally empty: the IS begins cleanup asynchronously and returns as
// soon as the in-memory store has been removed from its tracking map.
message DropIndexResponse {
}

// Issue #617: operator remediation tool — see rpc DeleteSegment above.
message DeleteSegmentRequest {
    // Tablespace name. Currently informational only (the IS resolves the
    // store by (table, index)); kept for symmetry with the other admin RPCs
    // and so future multi-tablespace IS instances do not need a proto bump.
    string tablespace = 1;
    string table = 2;
    string index = 3;
    // The segment's multipart storage key (e.g. "vidx_<indexUUID>_seg627").
    // This is the value reported by describe-index in the
    // corrupted_segments list (issue #616) and the value the IS uses to
    // address segment files in remote storage.
    string segment = 4;
    // Whether to delete the segment's multipart graph + map files from the
    // underlying DataStorageManager after removing it from in-memory state.
    // When false, the segment is unlinked from the IS but its files remain
    // (useful when an operator wants to preserve evidence of corruption for
    // post-mortem analysis).
    bool purge_storage = 5;
    // Whether to delete the segment even when its graph file IS reachable
    // in remote storage. Set to true only after careful verification — a
    // reachable graph file usually means the operator is targeting the
    // wrong segment.
    bool force = 6;
}

message DeleteSegmentResponse {
    // The storage key of the segment that was removed (echoes
    // DeleteSegmentRequest.segment).
    string segment = 1;
    // Whether the segment was found in the IS metadata and removed.
    bool removed = 2;
    // Number of live vectors lost as a result of the removal. -1 when
    // the IS could not compute the number — currently emitted only on the
    // race path where a concurrent compaction swap removed the segment
    // between the operator's snapshot and the engine's drop (the segment
    // handle is gone, so its liveCount is no longer accessible). In every
    // other no-op case (segment never matched, store not loaded) the engine
    // throws DeleteSegmentException → FAILED_PRECONDITION instead of
    // returning a response with vectors_lost=-1.
    int64 vectors_lost = 3;
    // Whether the segment's graph file was reachable in remote storage at
    // the moment the IS checked. Informational — operators use this to
    // decide whether to retry with --force or whether they were targeting
    // the wrong segment.
    bool graph_file_present = 4;
    // Whether the IS attempted to delete the segment's multipart files from
    // remote storage (only true when the request set purge_storage=true and
    // the in-memory removal succeeded).
    bool storage_purged = 5;
}

// ---- Push-based indexing RPC (testing only — see rpc PushEntries) ----

// One commit-log entry to push, with its client-assigned LSN.
message PushedLogEntry {
    // Log sequence number assigned by the client (ledgerId, offset).
    int64 lsn_ledger = 1;
    int64 lsn_offset = 2;
    // A single serialized herddb.log.LogEntry (LogEntry.serialize()).
    bytes entry = 3;
}

message PushEntriesRequest {
    // Entries to enqueue, in strictly increasing LSN order.
    repeated PushedLogEntry entries = 1;
}

message PushEntriesResponse {
    // Number of entries this call accepted into the push buffer.
    int64 accepted_count = 1;
    // Tailer watermark (last applied LSN) at the moment the call returned.
    int64 watermark_ledger = 2;
    int64 watermark_offset = 3;
}
