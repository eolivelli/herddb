syntax = "proto3";

option java_package = "herddb.indexing.proto";
option java_outer_classname = "IndexingServiceProto";
option java_multiple_files = true;

package indexing;

service IndexingService {
    rpc Search (SearchRequest) returns (SearchResponse);
    rpc GetIndexStatus (GetIndexStatusRequest) returns (GetIndexStatusResponse);

    // Diagnostic RPCs used by the indexing-admin CLI.
    rpc ListIndexes (ListIndexesRequest) returns (ListIndexesResponse);
    rpc DescribeIndex (DescribeIndexRequest) returns (DescribeIndexResponse);
    rpc ListPrimaryKeys (ListPrimaryKeysRequest) returns (stream PrimaryKeysChunk);
    rpc GetEngineStats (GetEngineStatsRequest) returns (GetEngineStatsResponse);
    rpc GetInstanceInfo (GetInstanceInfoRequest) returns (GetInstanceInfoResponse);

    // Blocks server-side until the loaded index state has reached the target
    // LSN (or the timeout/deadline expires). Used for deterministic testing of
    // shadow replicas and for admin operations that need to wait for catch-up.
    rpc WaitForCheckpoint (WaitForCheckpointRequest) returns (WaitForCheckpointResponse);

    // Returns whether this instance is a shadow replica and its catch-up state.
    rpc GetShadowStatus (GetShadowStatusRequest) returns (GetShadowStatusResponse);
}

message SearchRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    repeated float vector = 4;
    int32 limit = 5;
    bool return_score = 6;
}

message SearchResult {
    bytes primary_key = 1;
    float score = 2;
}

message SearchResponse {
    repeated SearchResult results = 1;
}

message GetIndexStatusRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
}

message GetIndexStatusResponse {
    int64 vector_count = 1;
    int32 segment_count = 2;
    // In-memory tailer position: the LSN of the most recently applied log
    // entry. Updated on every tailer advance, BEFORE the underlying state is
    // durably persisted to remote storage. Used by WAITFORINDEXES (a
    // queryability gate: "have all entries through this LSN been applied to
    // in-memory state?") and by diagnostic tooling. Must NEVER be used as a
    // recovery floor or commit-log retention pin, because the IS cannot
    // start from this LSN after a restart unless a checkpoint has covered
    // it (issue #364).
    int64 tailer_lsn_ledger = 3;
    int64 tailer_lsn_offset = 4;
    string status = 5;
    // Durable recovery LSN: the LSN of the most recent checkpoint whose
    // watermark has been successfully written to remote storage. After a
    // restart, the IS will resume from this LSN. Server-side commit-log
    // retention MUST pin against this value (and not tailer_lsn_*) so it
    // never drops a ledger that the IS would need to replay on recovery
    // (issue #364). A {0,0} value means "no durable watermark yet" —
    // callers MUST treat that as LogSequenceNumber.START_OF_TIME.
    int64 durable_lsn_ledger = 6;
    int64 durable_lsn_offset = 7;
    // Cold-start recovery progress (issue #381). Both fields are 0 when the
    // index is not currently loading from disk. When loading,
    // loading_segments_total > 0 and loading_segments_done advances from 0
    // to loading_segments_total. Operators and the wait_for_indexes barrier
    // can use the ratio to estimate remaining recovery time.
    int32 loading_segments_done = 8;
    int32 loading_segments_total = 9;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the tailer LSN.
    // Operators compute the tailer time-lag as `now - tailer_lsn_timestamp`.
    // 0 means "unknown" (no entries processed yet). Issue #423.
    int64 tailer_lsn_timestamp = 10;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the durable LSN.
    // Operators compute the durable time-lag as `now - durable_lsn_timestamp`.
    // 0 means "unknown" (no successful checkpoint yet). Issue #423.
    int64 durable_lsn_timestamp = 11;
}

// ---- Diagnostic RPCs ----

message IndexDescriptor {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    int64 vector_count = 4;
    string status = 5;
    // Number of on-disk segments held by the vector index.
    // Populated from PersistentVectorStore.getSegmentCount() (issue #285).
    int32 segment_count = 6;
    // Cold-start recovery progress (issue #381). Both fields are 0 when not loading.
    int32 loading_segments_done = 7;
    int32 loading_segments_total = 8;
}

message ListIndexesRequest {
}

message ListIndexesResponse {
    repeated IndexDescriptor indexes = 1;
}

message DescribeIndexRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
}

message DescribeIndexResponse {
    IndexDescriptor basic = 1;
    int32 dimension = 2;
    string similarity = 3;
    int64 live_node_count = 4;
    int64 ondisk_node_count = 5;
    int32 segment_count = 6;
    int32 live_shard_count = 7;
    int64 estimated_memory_bytes = 8;
    int64 live_vectors_memory_bytes = 9;
    int64 ondisk_size_bytes = 10;
    bool dirty = 11;
    // In-memory tailer position (most recently applied log entry).
    // Diagnostic only — see the matching field on GetIndexStatusResponse.
    int64 tailer_lsn_ledger = 12;
    int64 tailer_lsn_offset = 13;
    bool fused_pq_enabled = 14;
    int32 m = 15;
    int32 beam_width = 16;
    bool persistent = 17;
    string store_class = 18;
    // Compaction progress (issue #80). compaction_phase is one of
    // "idle", "writing-graph", "uploading-segment". compaction_progress
    // is an integer 0..100, or -1 when idle.
    string compaction_phase = 19;
    int32 compaction_progress = 20;
    int64 compaction_nodes_done = 21;
    int64 compaction_nodes_total = 22;
    int64 upload_bytes_done = 23;
    int64 upload_bytes_total = 24;
    // Global monotonic node-id counter (issue #256). int64 so it cannot
    // silently wrap after 2^31 ids are burned by ingest + compaction
    // reservations on a long-running cluster.
    int64 next_node_id = 25;
    // Durable recovery LSN: the LSN of the most recent checkpoint whose
    // watermark has been successfully persisted to remote storage. Same
    // semantics as the matching field on GetIndexStatusResponse (issue #364).
    int64 durable_lsn_ledger = 26;
    int64 durable_lsn_offset = 27;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the tailer LSN.
    // 0 = unknown. Issue #423.
    int64 tailer_lsn_timestamp = 28;
    // Wall-clock timestamp (epoch ms) of the LogEntry at the durable LSN.
    // 0 = unknown. Issue #423.
    int64 durable_lsn_timestamp = 29;
    // Per-index `numShards` value from the CREATE VECTOR INDEX WITH clause
    // (Index.properties[numShards]). Controls within-instance HNSW
    // graph-bucket granularity. Defaults to 1 when not set on the index.
    // Issue #451 — exposed so operators can verify what sharding configuration
    // an index is actually running with from the admin CLI.
    int32 num_shards = 30;
}

message ListPrimaryKeysRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    int32 chunk_size = 4;
    bool include_ondisk = 5;
    int64 limit = 6;
}

message PrimaryKeysChunk {
    repeated bytes primary_keys = 1;
    bool last = 2;
}

message GetEngineStatsRequest {
}

message GetEngineStatsResponse {
    int64 uptime_millis = 1;
    int64 tailer_watermark_ledger = 2;
    int64 tailer_watermark_offset = 3;
    int64 tailer_entries_processed = 4;
    bool tailer_running = 5;
    int32 apply_queue_size = 6;
    int32 apply_queue_capacity = 7;
    int64 total_estimated_memory_bytes = 8;
    int32 loaded_index_count = 9;
    int32 apply_parallelism = 10;
    // JVM heap (issue #80): read from ManagementFactory.getMemoryMXBean()
    int64 jvm_heap_used_bytes = 11;
    int64 jvm_heap_max_bytes = 12;
    int32 jvm_heap_used_pct = 13;
    // Issue #459: per-operation-type tailer counters. All monotonically
    // increasing since JVM start; rates are derived by the consumer.
    // entries_accepted = INSERT + UPDATE + DELETE entries (intent to
    // mutate the HNSW graph). entries_skipped = DDL + NOOP + REBALANCE +
    // BEGIN/COMMIT/ROLLBACKTRANSACTION (no graph mutation).
    int64 tailer_entries_accepted = 14;
    int64 tailer_entries_skipped = 15;
    int64 tailer_inserts = 16;
    int64 tailer_updates = 17;
    int64 tailer_deletes = 18;
    int64 tailer_ddl = 19;
    // Number of read batches the underlying tailer has completed: one
    // poll/follow cycle that processed at least one entry counts as one
    // batch. Together with tailer_entries_processed this lets operators
    // spot pathological "many tiny batches" patterns.
    int64 tailer_batches = 20;
}

message GetInstanceInfoRequest {
}

message GetInstanceInfoResponse {
    string instance_id = 1;
    string grpc_host = 2;
    int32 grpc_port = 3;
    string storage_type = 4;
    string data_dir = 5;
    int64 jvm_max_heap_bytes = 6;
    string tablespace_name = 7;
    string tablespace_uuid = 8;
    int32 instance_ordinal = 9;
    int32 num_instances = 10;
    // "primary" or "shadow".
    string role = 11;
    // For role=shadow, the instance_ordinal of the primary being shadowed.
    // Set to -1 for primaries.
    int32 shadow_of = 12;
}

// ---- Shadow-replica RPCs ----

message WaitForCheckpointRequest {
    string tablespace = 1;
    string table = 2;
    string index = 3;
    int64 target_ledger_id = 4;
    int64 target_offset = 5;
    // Hard upper bound on how long the server will block. If zero or negative
    // the server relies on the gRPC deadline of the call.
    int64 timeout_ms = 6;
}

message WaitForCheckpointResponse {
    // Current loaded LSN at the moment the server returned.
    int64 current_ledger_id = 1;
    int64 current_offset = 2;
    // True iff (current_ledger_id, current_offset) >= target at return time.
    bool reached = 3;
}

message GetShadowStatusRequest {
}

message GetShadowStatusResponse {
    // True when this instance is running as a shadow replica.
    bool is_shadow = 1;
    // instance_ordinal of the primary being shadowed; -1 for primaries.
    int32 shadow_of = 2;
    // True when the shadow has completed its first successful reload and is
    // serving queries. Always true for primaries.
    bool ready = 3;
    int64 loaded_ledger_id = 4;
    int64 loaded_offset = 5;
    // Latest LSN advertised by the primary via ZooKeeper. Set to -1/-1 if not
    // yet observed. For primaries this mirrors the loaded LSN.
    int64 primary_advertised_ledger_id = 6;
    int64 primary_advertised_offset = 7;
    int64 last_reload_timestamp_ms = 8;
    int64 reload_count = 9;
    // Minimum IndexStatus.generation currently loaded across every vector
    // store this shadow holds. Leaders aggregate the min across all
    // shadows to decide when compaction's pending-delete entries become
    // eligible for physical deletion. 0 when no vector store is loaded.
    int64 applied_index_status_generation = 10;
    // Wall-clock timestamp (epoch ms) of the LogEntry at loaded_ledger_id /
    // loaded_offset — the freshness of the data this shadow can serve. Picked
    // up from the primary's advertised
    // IndexingServiceCheckpointState.lastEntryTimestampMillis on every reload.
    // Operators compute the shadow data-staleness as
    // `now - loaded_entry_timestamp_ms`. 0 = unknown. Issue #423.
    int64 loaded_entry_timestamp_ms = 11;
}
