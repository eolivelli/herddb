# HerdDB on GKE with Google Cloud Storage (S3-compatible endpoint).
# Cluster: cluster1 / europe-west4 / project triple-env-475508-h3
#
# Prerequisites:
#   1. A GKE cluster (europe-west4 recommended — C3/C3D nodes provide AVX-512)
#   2. A GCS bucket
#   3. HMAC keys for a service account with access to the bucket
#   4. A Kubernetes Secret with the HMAC credentials:
#
#      kubectl create secret generic herddb-gcs-credentials \
#        --from-literal=S3_ACCESS_KEY=<HMAC-access-key-id> \
#        --from-literal=S3_SECRET_KEY=<HMAC-secret-access-key>
#
#   5. (If using a private GHCR image) A docker-registry Secret:
#
#      kubectl create secret docker-registry ghcr-credentials \
#        --docker-server=ghcr.io \
#        --docker-username=<github-user> \
#        --docker-password=<github-pat>
#
# Install:
#   helm install herddb . -f examples/gke/values.yaml \
#     --set fileServer.s3.bucket=<your-bucket-name>
#
# Memory layout (heap + direct + ~1 GiB JVM overhead = container limit):
#   server          :  20 g heap + 20 g Netty direct + 4 g JVM direct + 1 g ≈ 45 GiB RSS (50 GiB limit)
#   fileServer      :   6 g heap +  8 g direct + 1 g = 15 g  (< 16 GiB, 16 CPU)
#   indexingService :  28 g heap + 10 g direct + 1 g = 39 g  (< 63 GiB, 16 CPU)
#   indexOptimizer  :  28 g heap + 10 g direct + 1 g = 39 g  (< 63 GiB, 16 CPU — matched to IS)
#   bookkeeper      :   2 g heap +  1 g direct + 1 g =  4 g  (< 8 GiB)
#   zookeeper       : 512 m heap + 512 m direct       = ~1 g  (< 4 GiB)

#
# PodDisruptionBudgets are enabled below for every workload that runs in this
# example. The original motivation for this knob was a GKE cluster-autoscaler
# scale-down event that evicted herddb-zookeeper-0 mid-benchmark, expired all
# client sessions, and permanently lost a tablespace (see issue #332). On a
# long-running benchmark, blocking voluntary evictions is the desired default.

image:
  # Always re-pull so that re-pushed tags (common during active
  # benchmark iteration) are picked up on every pod restart.
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-credentials

server:
  mode: cluster
  storageMode: remote
  replicaCount: 1
  pdb:
    enabled: true
  # Pin to europe-west4-a to keep all traffic within a single zone
  # (cross-zone egress in GKE is billed; same-zone traffic is free).
  nodeSelector:
    topology.kubernetes.io/zone: "europe-west4-a"
  # 20 g heap + 20 g Netty direct + 4 g JVM direct + ~1 g overhead = ~45 g actual RSS
  # (50 GiB container limit gives ~5 GiB headroom for GC working set and OS).
  # Heap raised from 12 g to 20 g (issue #407): BookKeeper client allocates on-heap
  # DefaultChannelPromise per addEntry call; 12 g was insufficient under Phase B flush
  # load (~50K records/s) — heap exhausted in ~90s during the second checkpoint.
  #
  # Memory model after off-heap migration:
  #   -Dio.netty.maxDirectMemory=21474836480 (20 GiB, ≈ 20 × 1024³ bytes):
  #     GLOBAL cap shared by ALL Netty PooledByteBufAllocator instances:
  #       • PooledByteBufAllocator.DEFAULT   — network/gRPC/BK-client frames
  #       • HerdDBByteBufAllocators.dataPagesAllocator()  — DataPage value slabs
  #       • HerdDBByteBufAllocators.indexPagesAllocator() — BLink/BRIN key slabs
  #     PlatformDependent.incrementMemoryCounter() tracks the aggregate; all three
  #     pools check against the same DIRECT_MEMORY_LIMIT.
  #     HerdDBByteBufAllocators.maxDirectMemoryBytes() reads this value as the
  #     server's memory-budget reference (PROPERTY_MEMORY_LIMIT_REFERENCE_SOURCE=direct):
  #       data pages : 50% × 20 g = 10 g  (off-heap)
  #       PK index   : 20% × 20 g =  4 g  (off-heap)
  #       network    :              ~6 g  (remainder, shared with gRPC + BK client)
  #   -XX:MaxDirectMemorySize=4g:
  #     JVM's native cap for ByteBuffer.allocateDirect() (non-Netty code paths).
  #     Netty bypasses this via Unsafe.allocateMemory, so it does NOT limit the 20 g
  #     Netty pool above. Acts as a safety rail for non-Netty JVM direct buffers.
  javaOpts: "-Xms20g -Xmx20g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -Dio.netty.maxDirectMemory=21474836480 -XX:MaxDirectMemorySize=4g -DBUILD=20260505-fuzzy-checkpoint-v1"
  storage:
    data:
      # 100 GiB: enlarged from 10 GiB to hold a full JVM heap dump (server
      # heap = 32 GiB; heapdump-on-OOME + manual jmap both write to this PVC
      # via diagnostics.sh which guards against insufficient free space).
      size: 100Gi
    commitlog:
      size: 5Gi
  extraConfig:
    indexing.service.timeout: "300"
    # --- BookKeeper commit-log tuning ---
    # 10 GiB ledgers: at high ingest rates (20k+ ops/s) the server rolls a new
    # ledger every ~30 s with 128 MiB ledgers, writing an ever-growing activeLedgers
    # list to ZooKeeper on every roll. By the time 162 ledgers accumulate the ZK
    # write latency contributes to a ZK session expiry (issue #160).
    # With 10 GiB ledgers (~50 M entries each) the server creates ~2 ledgers per
    # hour instead of ~120, dramatically reducing ZK write frequency.
    server.bookkeeper.ledgers.max.size: "10737418240"          # 10 GiB
    # Retention raised to 35 min to satisfy the server constraint:
    # checkpoint.period < retention.period / 2
    # → retention.period must be > 2 × 300,000 ms = 600,000 ms.
    # 2,100,000 ms (35 min) gives a comfortable margin. Closed ledgers may
    # accumulate for up to 35 min before dropOldLedgers prunes them; with
    # 500 GiB ledger PVCs this is well within capacity for a 100M-row bench.
    server.bookkeeper.ledgers.retention.period: "2100000"      # 35 min (ms)
    # Reduced from 15 min (900,000 ms) to 5 min (300,000 ms). More frequent
    # checkpoints keep dirty-page count lower, reducing Phase B flush time per
    # checkpoint and bounding commit-log lag to a smaller window. The constraint
    # checkpoint.period < retention.period / 2 is satisfied:
    # 300,000 < 2,100,000 / 2 = 1,050,000 ✓
    server.checkpoint.period: "300000"                         # 5 min (ms)
    # --- BookKeeper client resilience tuning (issues #152, #164) ---
    # The code default (issue #152) is addEntryTimeoutSec=30 /
    # addEntryQuorumTimeoutSec=60. Overridden here because checkpoint-induced
    # bookie fsync stalls in long runs reached 309 s (issue #164). With only
    # one bookie, any timeout triggers ensemble-change →
    # BKNotEnoughBookiesException → permanent commit-log failure.
    # 3600 s effectively disables the per-entry timeout for benchmark purposes;
    # a truly dead bookie will be detected by ZooKeeper session expiry (30 s
    # default) + pod restart, not by addEntry timeout.
    bookkeeper.addEntryTimeoutSec: "3600"
    bookkeeper.addEntryQuorumTimeoutSec: "7200"
    # --- BookKeeper ledger layout (2-bookie ensemble) ---
    # ensemble=2: stripe entries across both bookies for load balancing.
    # write quorum=1: each entry is written to 1 bookie (no replication overhead).
    # ack quorum=1: one bookie ack is sufficient to commit.
    # opportunisticStriping=true: rotate writes across ensemble members even when
    # write quorum < ensemble, so both bookies receive an equal share of traffic.
    server.bookkeeper.ensemble.size: "2"
    server.bookkeeper.write.quorum.size: "1"
    server.bookkeeper.ack.quorum.size: "1"
    bookkeeper.opportunisticStriping: "true"
    # BookKeeper V2 wire protocol (no protobuf framing).
    # V2 avoids protobuf serialisation/deserialisation on every addEntry /
    # readEntries call, reducing CPU overhead and GC pressure on both the
    # server and the bookie. The bookie auto-negotiates; no bookie-side change
    # is needed. Must be set to the same value in the indexing service (below)
    # because the IS is also a BK client (commit-log tailer).
    bookkeeper.useV2WireProtocol: "true"
    # Raise the BK client's ZK session timeout (ZKMetadataDriverBase uses conf.getZkTimeout(),
    # which defaults to 10s) to match the server's own ZK session timeout (40s).
    # Without this the embedded BK client's ZK session can expire before the server's own
    # ZK session, causing NoNode /ledgers/available → LogNotAvailableException (issue #210).
    bookkeeper.zkTimeout: "40000"
  resources:
    requests:
      memory: "50Gi"
      cpu: "24"
    limits:
      memory: "50Gi"
      cpu: "24"

fileServer:
  replicaCount: 2
  pdb:
    enabled: true
  # Pin to europe-west4-a (same-zone traffic is free).
  nodeSelector:
    topology.kubernetes.io/zone: "europe-west4-a"
  # 6 g heap + 8 g direct + ~1 g JVM overhead = 15 g (< 16 GiB container).
  # The file server's working set is almost entirely off-heap: the
  # InMemoryBlockCacheObjectStorage holds pooled direct ByteBufs (heap dump
  # analysis confirmed <50 MB on-heap even under load). Heap is only needed for
  # Caffeine metadata, gRPC/ZK client objects, and classpath overhead — 6 g is
  # sufficient. The block cache budget auto-sizes to MaxDirectMemorySize/4 = 2 GiB.
  # -Dio.netty.maxDirectMemory=8589934592 (= MaxDirectMemorySize=8g in bytes):
  # Netty uses Unsafe.allocateMemory bypassing JVM Bits.reserveMemory (issue #253).
  javaOpts: "-Xms6g -Xmx6g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=8589934592 -XX:MaxDirectMemorySize=8g"
  storageMode: s3
  s3:
    endpoint: "https://storage.googleapis.com"
    region: "auto"
    bucket: "herddb-pages"
    # Credentials are read from this Kubernetes Secret instead of
    # being embedded in the ConfigMap.
    credentialsSecret: "herddb-gcs-credentials"
    # On-disk cache limit: maximum bytes the file server may keep in its
    # local disk cache (backed by the PVC below). This is NOT an in-memory
    # cache — pages are stored on the PVC's block device and evicted to GCS
    # GCS's S3-compatible endpoint requires path-style addressing and rejects
    # the AWS SDK v2 default request checksums (CRC32/CRC64NVME). Enable the
    # compatibility mode so the S3 client is configured to match GCS.
    gcsCompatibility: true
    # when the limit is reached. Set 10 GB below the PVC size to leave
    # headroom for temporary write buffers.
    # 200 Gi (214748364800 B) − 10 GB (10000000000 B) = 204748364800 B.
    cacheMaxBytes: 204748364800
  storage:
    # standard-rwo: pd-balanced (SSD) with WaitForFirstConsumer — PV is always
    # provisioned in the same zone as the pod, which is required for zone-pinned
    # StatefulSets.  File server's hot path is the in-process page cache and GCS
    # fallback; the local disk is only a cache tier, so pd-balanced is fine here.
    storageClass: "standard-rwo"
    size: 200Gi
  resources:
    requests:
      memory: "16Gi"
      cpu: "16"
    limits:
      memory: "16Gi"
      cpu: "16"

minio:
  enabled: false

zookeeper:
  enabled: true
  pdb:
    enabled: true
  # Pin to europe-west4-a (same-zone traffic is free).
  nodeSelector:
    topology.kubernetes.io/zone: "europe-west4-a"
  javaOpts: "-Xms1g -Xmx1g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=536870912 -XX:MaxDirectMemorySize=512m"
  storage:
    size: 10Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "4"
    limits:
      memory: "2Gi"
      cpu: "4"

bookkeeper:
  enabled: true
  replicaCount: 2
  pdb:
    enabled: true
  # Pin to europe-west4-a (same-zone traffic is free).
  nodeSelector:
    topology.kubernetes.io/zone: "europe-west4-a"
  # 2 g heap + 1 g direct + ~1 g JVM overhead → 4 g; container = 4 GiB.
  # Previously set to 3 GiB which left zero headroom for JVM overhead (metaspace,
  # code cache, thread stacks, GC structures) — bookie was OOMKilled after ~25 min
  # of high-throughput ingest (SortedLedgerStorage rapid memtable flushes push
  # native allocations transiently above MaxDirectMemorySize). Raised to 4 GiB.
  javaOpts: "-Xms2g -Xmx2g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=1073741824 -XX:MaxDirectMemorySize=1g"
  # Enable FINE logging for BK write processors so OperationRejectedException
  # (bookie backpressure) becomes visible.
  loggingProperties: |
    handlers=java.util.logging.ConsoleHandler

    # Default global logging level
    .level= INFO

    # BookKeeper bookie — raised from SEVERE so WARN-level messages are visible:
    # non-writable channels, fenced-ledger warnings, bookie state transitions.
    org.apache.bookkeeper.level=WARNING

    # Enable FINE (= SLF4J DEBUG) only for the two write-processor classes so that
    # OperationRejectedException (backpressure) becomes visible when the bookie
    # storage cannot keep up with the write rate.
    # One log line per rejected addEntry — potentially verbose under sustained
    # back-pressure, but that is the signal needed to diagnose silent write failures.
    org.apache.bookkeeper.proto.WriteEntryProcessorV3.level=FINE
    org.apache.bookkeeper.proto.WriteEntryProcessor.level=FINE

    ############################################################
    # Handler specific properties.
    ############################################################
    # Raised to FINE so the write-processor DEBUG lines above reach the console.
    java.util.logging.ConsoleHandler.level = FINE
    java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
  # Disable bookie journal fsync (journalSyncData=false) for benchmark use.
  # With journalSyncData=true (default), the bookie calls fdatasync() after
  # every journal flush batch — a single fsync during a checkpoint-induced I/O
  # burst can stall for 300+ s, triggering addEntry timeouts and
  # BKNotEnoughBookiesException (issue #164). With journalSyncData=false the
  # bookie acknowledges entries after writing to the OS page cache (no fsync).
  # journalPageCacheFlushIntervalMSec controls how often the page cache is
  # flushed to disk (default: 1000 ms); data is still durably written, just
  # not synchronously confirmed. Risk: on OS crash buffered-but-unsynced journal
  # entries may be lost — acceptable for vector benchmarks.
  extraConfig:
    journalSyncData: "false"
    journalPageCacheFlushIntervalMSec: "1000"
    # Raise bookie ZK session timeout from the 10s default (AbstractConfiguration.getZkTimeout())
    # to 40s so it survives checkpoint-induced I/O bursts without expiring (issue #210).
    zkTimeout: "40000"
    # Raise the bookie's in-progress read-request gate (issue #449).
    # Default is 10,000. With 2 IS replicas each catching up on ~1,000 BK entries at
    # tailbatchsize=10,000, both IS tailers connecting simultaneously fired
    # "Too many read requests in progress, disabling autoread" immediately, which
    # caused BK-0 to freeze for ~10 minutes while SortedLedgerStorage flushes were
    # running concurrently, blocking all addEntry writes. Setting to 1,000,000
    # (100× default) prevents the IS catch-up burst from triggering the gate.
    maxReadsInProgressLimit: "1000000"
  # Journal: pd-SSD (premium-rwo) — random write I/O, latency-sensitive.
  #   During a 1B bigann ingest run the bookie journal showed p99.9 write
  #   latency of 45–60 ms on pd-balanced (standard-rwo). This tail feeds a
  #   queuing effect: 8 ingest workers serialised on 1 BK ledger — the p99
  #   commit arriving at the back of a queue of ~11 others must wait ~5 s.
  #   Switching to pd-SSD (premium-rwo) should reduce the journal p99.9 to
  #   sub-ms, eliminating the tail and flattening commit-latency p99 from
  #   ~5,100 ms to the sub-second range. (Analysis from run 2026-04-28.)
  # Ledger: HDD (pd-standard) — large sequential append; saves SSD quota.
  # standard-hdd-zonal: pd-standard HDD with WaitForFirstConsumer so the PV
  # is always provisioned in the same zone as the pod (unlike "standard" which
  # uses Immediate binding and can land in the wrong zone for zone-pinned pods).
  storage:
    journal:
      storageClass: "premium-rwo"   # pd-SSD: low-latency journal writes
      size: 100Gi
    ledger:
      storageClass: "standard-hdd-zonal"
      size: 500Gi
  resources:
    requests:
      memory: "4Gi"
      cpu: "4"
    limits:
      memory: "4Gi"
      cpu: "4"

indexingService:
  enabled: true
  storageMode: remote
  replicaCount: 2
  # Raised from the chart default (failureThreshold=3, periodSeconds=15 → 45s tolerance)
  # to survive IS memory-flush cycles where the HTTP /metrics endpoint becomes temporarily
  # unresponsive under extreme GC pressure (98% heap). The double-flush scenario observed
  # on 2026-04-28 (issue #340) stalled both IS replicas for up to 8+ minutes; at 45s
  # tolerance both pods were SIGKILL'd (exit 137) by the kubelet.
  # 20 × 30s = 600s (10 min) gives enough headroom for the flush to complete.
  livenessProbe:
    failureThreshold: 20
    periodSeconds: 30
    initialDelaySeconds: 30
  pdb:
    enabled: true
  # Zone-pinned to europe-west4-a (same-zone traffic is free) but no machine-family
  # selector — the IS runs on standard nodes. AVX-512 acceleration is handled by
  # the index-optimizer pods (pinned to c3), which do the heavy offline HNSW merges.
  # The IS only does real-time indexing (tailer + live-graph inserts), which is
  # not AVX-512-bound.
  nodeSelector:
    topology.kubernetes.io/zone: "europe-west4-a"
  # 28 g heap + 10 g direct + ~1 g JVM overhead = 39 g (< 40 GiB container; 1 GiB headroom).
  # Heap raised from 24 g to 28 g (+4 GiB) to give more headroom above the
  # indexing.memory.vector.limit flush point. jmap histograms at ~21% progress showed
  # float[] at 9.36 GiB (1563 VectorSegments) + int[] 2.15 GiB + TreeMap$Entry 2.46 GiB
  # + herddb.utils.Bytes 2.42 GiB totalling ~20 GiB, while the IS internal estimate
  # reported only 14–15 GiB (6–8 GiB gap documented in issue #360). With 24 g heap the
  # untracked jvector graph memory pushed old-gen to 22–23 GiB (92–96% of Xmx), triggering
  # sustained G1 back-pressure cycles. At 28 g the same workload leaves ~5–9 GiB of GC
  # headroom above the actual peak, reducing the frequency and severity of FATAL ticks.
  # 10 g direct: 3.5 GiB SegmentBlockCache (auto = heap/4 ≈ 7 GiB for this heap) + 256 MiB
  # in-flight read reservation (remote.file.client.max.inflight.read.bytes below) + 4 GiB
  # Netty PoolArena transient peak for Phase C checkpoint loads and concurrent gRPC
  # streaming + ~2 GiB headroom. 6 g was insufficient under Phase C segment-load bursts
  # (issue #246: OOM after 7 × 583 MB segments loaded into the block cache).
  # --add-modules jdk.incubator.vector: required for Panama Vector API (jvector 4.x).
  # -Dio.netty.maxDirectMemory=10737418240 (= MaxDirectMemorySize=10g in bytes):
  # Netty uses Unsafe.allocateMemory bypassing JVM Bits.reserveMemory, preventing
  # phantom-reference GC delays from exhausting the direct-memory counter (issue #253).
  # numDirectArenas=8 (Netty default on most core counts): 16 arenas amplified the 4 MiB
  # PoolChunk fragmentation that triggered issue #246; 8 gives enough parallelism to
  # mitigate issue #122 lock contention without compounding arena growth.
  # tailbatchsize=1000 caps the BK read batch per followTheLeader() call in the IS
  # tailer, cutting retained working set by 10× vs. the 10000 default (issue #180).
  # -XX:+HeapDumpOnOutOfMemoryError: write a heap dump to the data PVC on any
  # OutOfMemoryError so OOM crashes are analysable post-mortem even after a pod
  # restart. The IS previously hit OOM in the compaction thread (Int2IntHashMap.rehash)
  # without leaving any on-disk artefact because the flag was absent (observed at
  # tick 84 and tick 105 of the BIGANN 1B run, 2026-04-29).
  # -XX:HeapDumpPath=/opt/herddb/indexdata/heapdump.hprof: the data PVC is mounted
  # at /opt/herddb/indexdata and survives pod restarts (PVC lifecycle > pod lifecycle).
  # The PVC was enlarged to 100 GiB (from 20 GiB) to hold a full heap dump of the
  # 28 GiB heap (worst-case ~28 GiB HPROF) plus IS working data (currently <1 GiB).
  # -Dherddb.vectorindex.streamingCompactionEnabled=true: streaming merge — the IS
  #   compacts segments incrementally rather than in monolithic passes.
  # -Dherddb.vectorindex.searchAsyncPipelineEnabled=true: async reads — segment
  #   block reads during ANN search run through the async I/O pipeline.
  javaOpts: "-Xms28g -Xmx28g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -Dio.netty.maxDirectMemory=10737418240 -XX:MaxDirectMemorySize=10g -Dio.netty.allocator.numDirectArenas=8 -Dherddb.vectorindex.streamingCompactionEnabled=true -Dherddb.vectorindex.searchAsyncPipelineEnabled=true -Dherddb.commitlog.tailbatchsize=10000 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/herddb/indexdata/heapdump.hprof"
  storage:
    data:
      # 100 GiB: accommodates a full heap dump (28g heap, worst-case ~28 GiB HPROF)
      # plus IS working data. STS was deleted via teardown+reset, so the
      # volumeClaimTemplate can be freely set on this fresh install.
      size: 100Gi
    log:
      size: 5Gi
  extraConfig:
    # BookKeeper V2 wire protocol — mirrors the server setting above.
    # The IS reads BK ledgers as a commit-log tailer; enabling V2 here
    # removes protobuf overhead from every readEntries call.
    bookkeeper.useV2WireProtocol: "true"
    # IS own ZK session timeout (used by ZookeeperMetadataStorageManager and
    # CommitLogTailer — IndexingServerConfiguration.PROPERTY_ZOOKEEPER_SESSION_TIMEOUT,
    # default already 40000 ms but made explicit here for visibility).
    server.zookeeper.session.timeout: "40000"
    # IS embedded BK client ZK session timeout (ZKMetadataDriverBase uses
    # conf.getZkTimeout() which defaults to 10s — raise to 40s, matching issue #210 fix).
    bookkeeper.zkTimeout: "40000"
    # DML apply worker parallelism (IndexingServerConfiguration.PROPERTY_APPLY_PARALLELISM).
    # Default is 0 (auto = availableProcessors / 2 = 8 on a 16-CPU pod).
    # Reduced from 16 to 8 (2026-04-29): at 16 threads with --index-num-shards 4 the IS
    # ran 16 concurrent HNSW builders on a -Xmx24g (now 28g) heap, driving G1 old-gen to
    # 23–25 GiB during bigann 1B ingest and causing repeated OOM in the compaction thread
    # (Int2IntHashMap.rehash). Halving the worker count reduces peak live-set pressure while
    # still utilising 8 of the 16 allocated CPUs. The remaining 8 CPUs absorb G1 GC, gRPC,
    # and BK-tailer threads without competing with the apply workers.
    # Effective apply_queue_capacity = 8 workers × 1000 (default queue per worker) = 8,000.
    indexing.apply.parallelism: "8"
    # Maximum number of vectors held in the in-memory "live" HNSW graph before
    # it is sealed into a segment. Raised to 100,000 so the IS builds larger
    # live graphs (fewer, denser segments) during sustained ingest.
    indexing.vector.maxLiveGraphSize: "100000"
    # Vector store in-memory budget (IndexingServerConfiguration.PROPERTY_MEMORY_VECTOR_LIMIT).
    # Default 0 means maxMemory/3 = 24 GiB / 3 = 8 GiB.  At 8 GiB the IS triggers
    # memory-pressure checkpoints (flush to file-server) every second during heavy
    # ingest, because the HNSW graph grows past 70% of that 8 GiB limit almost
    # immediately.
    #
    # History of tuning:
    #   20 GiB (21474836480): caused OOM during bigann 100M run. jmap histogram showed
    #     float[] at 13.3 GiB + HNSW graph overhead (int[], ConcurrentNeighborMap, etc.)
    #     at ~3 GiB + BK/Netty/GC at ~2 GiB = ~22 GiB total → heap exhausted at -Xmx24g.
    #     The flush is triggered at ~70% of the limit (~14 GiB) but ingest at ~5K
    #     vectors/s per IS kept pushing past it before the flush could drain.
    #   14 GiB (15032385536): flush starts at ~70% = ~9.8 GiB, giving ~10 GiB of
    #     headroom before the 24 GiB heap ceiling. More frequent flushing but avoids
    #     OOM. File-server CPU was only ~9% during ingest (plenty of headroom for more
    #     flush traffic). Accepts slightly more checkpoint I/O in exchange for stability.
    indexing.memory.vector.limit: "15032385536"
    # Caps bytes across in-flight readFile/readFileRange gRPC calls that
    # allocate a pooled direct ByteBuf. Bytes (not request count) so the cap
    # treats a 16 KiB RemoteRandomAccessReader block and a 4 MiB Phase-C
    # chunk in proportion to the direct-memory pressure they impose. Default
    # 256 MiB; set explicitly here for visibility. Lower under tighter
    # MaxDirectMemorySize budgets, raise only if Netty PoolArena headroom
    # is proven sufficient (see issue #246).
    remote.file.client.max.inflight.read.bytes: "268435456"
    # Symmetric write-side cap (issue #468). Bounds bytes across in-flight
    # writeFile/writeFileBlock/writeMultipartFile calls so a Phase B
    # compaction write burst (graphs of 322–658 MB + maps of 159–326 MB at
    # gist1m scale) cannot fan out hundreds of in-flight blocks at once and
    # starve concurrent ANN reads on the shared event-loop pool / file
    # server. Default 256 MiB matches the read cap; lower this (e.g.
    # "67108864" = 64 MiB) on smaller pods or profiles where compaction
    # visibly hurts query p99 latency. Set explicitly here for visibility.
    remote.file.client.max.inflight.write.bytes: "268435456"
    # Disable segment-count back-pressure (PR #358 / issue #354).
    # Default threshold is 500 segments: when exceeded, addVectorInternal()
    # parks the apply thread in waitForSegmentCountRelief() until compaction
    # drains below the limit. During bigann 1B ingest both IS replicas hit
    # 570-672 segments and became permanently stuck — compaction could not
    # outrun new segment creation, causing a deadlock. Setting to
    # Integer.MAX_VALUE (documented disable value) unblocks the apply threads
    # immediately. Compaction continues to run but no longer gates indexing.
    vector.index.compaction.backpressure.segments: "2147483647"
    # Allow compaction to merge up to 2000 segments per cycle (default 200).
    # At 672/588 accumulated segments the default cap means compaction would
    # need 3-4 cycles to catch up; raising to 2000 lets it drain the backlog
    # in a single pass. Tiered compaction scaling (PR #358) applies an 8×
    # multiplier at >500 segments anyway, so this raises the effective cap to
    # 16000 in the current situation — well above the 672/588 observed counts.
    vector.index.compaction.maxCount: "2000"
  # Direct S3 download for segment map files during cold-start recovery (issue #381).
  # Mirrors the file server's GCS settings so the IS downloads segment map blocks
  # directly from GCS rather than routing them through the gRPC file-server.
  # With 7200+ segments at ~3s per segment over gRPC this cuts cold-start from
  # 6+ hours to a few minutes (download is parallel + S3 throughput >> gRPC).
  s3:
    directEnabled: true
    # GCS S3-compatible endpoint — same as fileServer.s3.endpoint.
    endpoint: "https://storage.googleapis.com"
    region: "auto"
    # Must match fileServer.s3.bucket (override with --set on install).
    bucket: "herddb-pages"
    # Enable GCS-compatibility tweaks on the S3 client
    # (path-style addressing + WHEN_REQUIRED SDK checksums) — required for GCS.
    gcsCompatibility: true
    # Reuse the same Kubernetes Secret as the file server (S3_ACCESS_KEY / S3_SECRET_KEY).
    credentialsSecret: "herddb-gcs-credentials"
  resources:
    # Bumped from 40 Gi to 63 Gi (2026-05-01) after IS-1 was OOMKilled at the 40 GiB
    # cgroup limit during a bigann 1B ingest run. The configured budget (28 g heap +
    # 10 g direct + 1 g JVM overhead = 39 g) had only 1 GiB headroom under the cgroup
    # ceiling — insufficient to absorb off-heap growth (Netty PoolArena fragmentation,
    # native HNSW allocations, glibc arena overhead, jvector graph bytes underreported
    # vs. the 15 GiB indexing.memory.vector.limit per issue #360). 63 GiB gives ~24 GiB
    # headroom above the JVM-tracked 39 g budget, comfortably fitting on the
    # c3-standard-22 nodes (86 GiB allocatable) currently provisioned by GKE Autopilot.
    # 2 replicas × 16 CPUs: each IS handles 4 of the 8 index shards (~500 M vectors/IS
    # for the bigann 1 B run).
    requests:
      memory: "63Gi"
      cpu: "16"
    limits:
      memory: "63Gi"
      cpu: "16"

indexOptimizer:
  # External segment-merger service. When enabled, the IS switches every new
  # segmented-v2 index to "pressure-driven fallback" mode — the IS only runs
  # local compaction when back-pressure forces it; the optimizer handles all
  # steady-state merges via a ZK-backed task queue.
  #
  # Pinned to c3 (Intel Sapphire Rapids, AVX-512F/BW/VL/DQ/VNNI/FP16) so that
  # jvector's SIMD distance kernels run at full width during PQ retraining and
  # HNSW graph construction.  The IS has been moved off c3 (nodeSelector: {})
  # so these expensive nodes are fully reserved for merge work.
  enabled: true
  replicas: 2
  tablespaceName: "herd"
  intervalMs: 300000
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector:
    cloud.google.com/machine-family: "c3"
    topology.kubernetes.io/zone: "europe-west4-a"
  # gist1m dataset: 1,000,000 vectors × 960 dimensions, L2 (Euclidean) distance.
  # dim is REQUIRED — SegmentMetadata znodes don't carry the dimension.
  # similarity: EUCLIDEAN matches the gist1m preset and the index DDL produced
  # by VectorBench for that dataset.
  merger:
    dim: 960
    M: 16
    beamWidth: 100
    neighborOverflow: 1.2
    alpha: 1.4
    similarity: "EUCLIDEAN"
  # targetMaxBytes: 8 GiB (chart default).  For gist1m with 2 IS replicas and
  # numShards=4, each IS owns ~500 K vectors.  A 960-dim FusedPQ segment for
  # 500 K vectors is ~4–5 GiB → one final large segment per IS shard pair,
  # well within the 8 GiB target.
  remoteFileClient:
    # 512 MiB write buffer — matches the IS write cap and ensures the optimizer
    # doesn't stall on gRPC back-pressure when uploading large merged graphs.
    maxInflightWriteBytes: "536870912"   # 512 MiB
  # JVM budget matched to the indexing-service budget (same node class, same
  # memory envelope).
  #   -Xms28g -Xmx28g: same heap as the IS — large enough for PQ codebook
  #     reservoir (~500 MB for 960-dim), jvector OnDiskGraphIndexCompactor
  #     working set, and GC headroom during multi-segment merges.
  #   --add-modules jdk.incubator.vector: enables Panama Vector API (AVX-512
  #     kernels in jvector — the primary reason the optimizer runs on c3 nodes).
  #   -Dio.netty.maxDirectMemory=10737418240 (10 GiB): Netty uses
  #     Unsafe.allocateMemory bypassing JVM Bits.reserveMemory; this cap
  #     matches the IS setting so gRPC file-server I/O during merge uploads
  #     never exceeds the same direct-memory envelope.
  #   -XX:MaxDirectMemorySize=10g: JVM native cap for non-Netty direct buffers.
  #   -Dio.netty.allocator.numDirectArenas=8: matches IS; reduces PoolChunk
  #     fragmentation on 16-CPU nodes without lock-contention issues.
  #   -Dherddb.vectorindex.streamingCompactionEnabled=true: streaming merge —
  #     the optimizer compacts segments incrementally rather than in monolithic
  #     passes (longevity-run tuning — keeps merge work flowing continuously).
  #   -Dherddb.vectorindex.searchAsyncPipelineEnabled=true: async reads — segment
  #     block reads run through the async I/O pipeline.
  #   -XX:+HeapDumpOnOutOfMemoryError / HeapDumpPath=/tmp: write heap dump to
  #     the tmp PVC on OOM so crashes are analysable post-mortem.
  javaOpts: "-Xms28g -Xmx28g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -Dio.netty.maxDirectMemory=10737418240 -XX:MaxDirectMemorySize=10g -Dio.netty.allocator.numDirectArenas=8 -Dherddb.vectorindex.streamingCompactionEnabled=true -Dherddb.vectorindex.searchAsyncPipelineEnabled=true -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"
  # tmp PVC: staged merge-intermediate files before upload.
  #   gist1m full-convergence merge: output graph ~7.8 GiB + map ~3.9 GiB
  #   → ~12 GiB per merge pass.  50 GiB leaves room for two concurrent passes
  #   plus headroom for page-cache spill.
  #
  # NOTE: standard-hdd-zonal (pd-standard) is NOT compatible with c3 machine
  # types — GCE rejects the attach with "pd-standard disk type cannot be used
  # by c3-standard-* machine type".  Use standard-rwo (pd-balanced) instead,
  # which is supported on all GKE machine families including c3.
  storage:
    tmp:
      storageClass: "standard-rwo"
      size: 50Gi
  resources:
    # Matched to the indexing-service resource envelope so both land on the
    # same c3 node tier provisioned by GKE Autopilot.
    # Memory layout (heap + direct + JVM overhead = JVM RSS):
    #   28 g heap + 10 g direct + ~1 g JVM overhead  =  ~39 GiB JVM RSS
    #   /tmp output graph (gist1m full merge)          =  ~7.8 GiB
    #   /tmp output map                                =  ~3.9 GiB
    #   Input segment page-cache                       =  ~6–8 GiB
    #   ─────────────────────────────────────────────    ~57–59 GiB peak
    # 63 GiB gives ~4–6 GiB headroom; matches the IS ceiling and fits on
    # the c3-standard-22 nodes (86 GiB allocatable) already provisioned.
    requests:
      memory: "63Gi"
      cpu: "16"
    limits:
      memory: "63Gi"
      cpu: "16"

tools:
  enabled: true
  # PDB is on by default for tools (see values.yaml); pinned here for clarity.
  pdb:
    enabled: true
  # Pin to europe-west4-a (same-zone traffic is free).
  nodeSelector:
    topology.kubernetes.io/zone: "europe-west4-a"
  gcs:
    credentialsSecret: "herddb-gcs-credentials"
    # Shared bucket of reusable benchmark datasets. The tools pod
    # gets VECTORBENCH_DATASETS_BUCKET=gs://herddb-datasets, which
    # run-bench.sh and the herddb-gke-bench agent use as the default
    # prefix for custom --dataset-url values. Standard presets
    # (sift1m, gist1m, …) still resolve through DatasetLoader's
    # built-in public URLs.
    datasetsBucket: "herddb-datasets"
  storage:
    datasets:
      # HDD to avoid SSD quota; dataset files are downloaded once and read
      # sequentially during ingest — HDD throughput is sufficient.
      storageClass: "standard-hdd-zonal"
      size: 200Gi
  # Heap raised to 6 g: sift10m base set (10M × 128-dim × 4 B = 5.12 GB)
  # must fit in JVM heap during ingest. Container limit = heap + ~1 GiB overhead.
  javaOpts: "-Xms512m -Xmx6g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=1073741824 -XX:MaxDirectMemorySize=1g"
  resources:
    requests:
      memory: "7Gi"
      cpu: "4"
    limits:
      memory: "7Gi"
      cpu: "4"

prometheus:
  enabled: true

grafana:
  enabled: true
