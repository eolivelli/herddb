# Full-stack HerdDB on a local k3s-in-docker cluster.
#
# Deploys: HerdDB server (cluster mode, remote storage) + file server
# (S3 on MinIO) + indexing service + ZooKeeper + BookKeeper + MinIO +
# tools pod.
#
# Mirrors the structure of examples/gke/values.yaml but with resources
# and PVCs sized for a developer laptop / workstation.
#
# Prometheus and Grafana are disabled by default to save RAM; enable them
# ad-hoc with --set prometheus.enabled=true --set grafana.enabled=true.
#
# File-server and indexing-service heap are sized for large-scale vector
# benchmarks (e.g. gist1m / sift1m with 1M × 960-dim vectors). The
# file-server needs ≥ 4 g because a single 960-dim segment can reach
# ~1.2 GB of raw float data and the CachingObjectStorage reads it into
# the JVM heap during compaction.
#
# Server memory layout: 8 g heap + 8 g Netty direct + 2 g JVM direct + 1 g
# overhead → 19 GiB container. After the off-heap migration of data pages
# (issue #399) and BLink/BRIN keys (issue #405), the heap holds only the
# transient working set (transactions, plan caches, BK-client on-heap state)
# while DataPage values and PK index keys live in dedicated Netty pooled
# direct allocators. See the long comment above `server.javaOpts` for the
# memory-budget breakdown.
#
# Tools heap raised to 2 g: loading the sift1m base set (1M × 128 × 4 B
# = 512 MB) into the vector-bench JVM plus JVM overhead exceeds 512 Mi;
# the old 512 Mi container limit caused OOMKill during ingest.
#
# File-server cache and MinIO storage are sized to hold the complete
# index + data pages for gist1m M=32 without any MinIO round-trips on
# warm queries:
#   - gist1m data pages  : ~3.7 GB (1M × 960-dim rows via remote storage)
#   - gist1m M=32 segment: ~4.8 GB (FusedPQ graph)
#   - sift1m  M=32 segment: ~0.8 GB
#   Peak single-run total: ≈ 8.5 GB → 30 GiB cache/PVC gives ~3.5× headroom.
#
# Install via ./install.sh (which runs k3s inside a Docker container
# and imports the HerdDB image into containerd so imagePullPolicy=Never
# works).

image:
  pullPolicy: Never

server:
  mode: cluster
  storageMode: remote
  replicaCount: 1
  # 8 g heap + 8 g Netty direct + 2 g JVM direct + ~1 g overhead = 19 GiB container.
  #
  # Memory layout after off-heap migration of data pages and BLink/BRIN keys
  # (issues #399, #405, #406): the dominant memory consumers (DataPage values
  # and PK index keys) now live in Netty pooled direct buffers instead of the
  # JVM heap, so the heap shrinks while the Netty direct cap grows.
  #
  # Heap reduced from 16 g to 8 g: dirty data pages (e.g. sift10m's ~5 GiB) are
  # no longer serialized through on-heap VisibleByteArrayOutputStream and the
  # PK index keys live in indexPagesAllocator. The remaining 8 g heap covers
  # transactions, plan caches, GC working set, and on-heap BookKeeper client
  # allocations (DefaultChannelPromise per addEntry — see issue #407 for the
  # GKE-scale evidence; k3s-local's lower ingest rate keeps this well below 8 g).
  #
  #   -Dio.netty.maxDirectMemory=8589934592 (8 GiB, ≈ 8 × 1024³ bytes):
  #     GLOBAL cap shared by ALL Netty PooledByteBufAllocator instances:
  #       • PooledByteBufAllocator.DEFAULT   — network/gRPC/BK-client frames
  #       • HerdDBByteBufAllocators.dataPagesAllocator()  — DataPage value slabs
  #       • HerdDBByteBufAllocators.indexPagesAllocator() — BLink/BRIN key slabs
  #     PlatformDependent.incrementMemoryCounter() tracks the aggregate; all
  #     three pools check against the same DIRECT_MEMORY_LIMIT.
  #     HerdDBByteBufAllocators.maxDirectMemoryBytes() reads this value as the
  #     server's memory-budget reference (PROPERTY_MEMORY_LIMIT_REFERENCE_SOURCE=direct):
  #       data pages : 50% × 8 g = 4 g    (off-heap)
  #       PK index   : 20% × 8 g = 1.6 g  (off-heap)
  #       network    :          ~2.4 g    (remainder, shared with gRPC + BK client)
  #     Netty uses Unsafe.allocateMemory bypassing JVM Bits.reserveMemory,
  #     preventing phantom-reference GC delays from exhausting the direct-memory
  #     counter (issue #253).
  #   -XX:MaxDirectMemorySize=2g:
  #     JVM's native cap for ByteBuffer.allocateDirect() (non-Netty code paths).
  #     Netty bypasses this via Unsafe.allocateMemory, so it does NOT limit the
  #     8 g Netty pool above. Acts as a safety rail for non-Netty JVM direct
  #     buffers (e.g. NIO transient allocations).
  javaOpts: "-Xms8g -Xmx8g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -Dio.netty.maxDirectMemory=8589934592 -XX:MaxDirectMemorySize=2g"
  storage:
    data:
      size: 5Gi
    commitlog:
      size: 2Gi
  extraConfig:
    # 600 s per-call gRPC deadline for IS search: GIST-class indexes can spend
    # 400+ s inside a single Phase B checkpoint and the baked-in 120 s default
    # would time out mid-cycle (issue #235).
    indexing.service.timeout: "600"
    # --- BookKeeper commit-log tuning (experiment for issues #141 / #145) ---
    # Ledger max size raised to 10 GiB (from 128 MiB) for bigann 100M ingest.
    # At 128 MiB (~200 B/entry × 640k entries/ledger) the server rolled a new
    # ledger every ~30 s under 20k ops/s, writing an ever-growing activeLedgers
    # list to ZooKeeper on every roll. By the time 162 ledgers had accumulated
    # the ZK write latency contributed to a ZK session expiry (issue #160).
    # With 10 GiB ledgers (~50 M entries each) the server creates ~2 ledgers
    # per hour instead of ~120, dramatically reducing ZK write frequency and
    # activeLedgers list growth.
    server.bookkeeper.ledgers.max.size: "10737418240"          # 10 GiB
    # Default retention is 2 days (1000*60*60*24*2 ms). On a 30-min bench
    # that's "never" — closed ledgers pile up on the bookie's ledgers PVC
    # and keep per-ledger state alive in the bookie's memtable/file-handle
    # caches. 5 min is enough to let a checkpoint durably capture the LSN
    # before cleanup and lets dropOldLedgers actually prune between checkpoints.
    server.bookkeeper.ledgers.retention.period: "300000"       # 5 min (ms)
    # The server enforces (checkpoint.period < retention.period / 2), so a
    # 5-min retention requires a checkpoint period < 150 s. Default is 15 min,
    # which would fail validation. Drop to 1 min — more frequent checkpoints
    # also reduce the per-checkpoint catch-up backlog that was the root cause
    # of issue #145 (LSN mismatch after a 25-min waitForInstanceCatchUp).
    server.checkpoint.period: "60000"                          # 1 min (ms)
    # --- BookKeeper client resilience tuning (issues #152, #164) ---
    # The code default (issue #152) is now addEntryTimeoutSec=30 /
    # addEntryQuorumTimeoutSec=60. Overridden here to 3600/7200 s because
    # checkpoint-induced bookie fsync stalls in the bigann 100M run reached
    # 309 s (issue #164). With only one bookie, any timeout triggers
    # ensemble-change → BKNotEnoughBookiesException → permanent commit-log
    # failure. 3600 s effectively disables the per-entry timeout for benchmark
    # purposes; a truly dead bookie will be detected by ZooKeeper session
    # expiry (30 s default) + pod restart, not by addEntry timeout.
    bookkeeper.addEntryTimeoutSec: "3600"
    bookkeeper.addEntryQuorumTimeoutSec: "7200"
    # BookKeeper V2 wire protocol (no protobuf framing on addEntry / readEntries).
    # Code-level default since issue #392; kept here explicitly for parity with the
    # GKE example so operators can see the effective value at a glance. Set to
    # "false" to fall back to V3.
    bookkeeper.useV2WireProtocol: "true"
  resources:
    requests:
      memory: "19Gi"
      cpu: "2"
    limits:
      memory: "19Gi"
      cpu: null

fileServer:
  replicaCount: 1
  storageMode: s3
  # Heap reduced to 2 g: the file server's hot path is disk-cache I/O and gRPC
  # streaming; it does not need a large heap. A smaller heap leaves more RSS
  # budget for Netty direct buffers.
  # -Dio.netty.maxDirectMemory=3221225472 (= MaxDirectMemorySize=3g in bytes):
  # Netty uses Unsafe.allocateMemory bypassing JVM Bits.reserveMemory, preventing
  # phantom-reference GC delays from exhausting the direct-memory counter (issue #253).
  # With -Xmx2g: heap (2 g) + direct (3 g) + JVM overhead ≈ 1 g → 6 GiB container.
  # Previously -Xmx4g with no MaxDirectMemorySize cap caused OOMKill when the IS
  # loaded 100+ HNSW segments concurrently (heap 4 g + direct up to 4 g > 5 GiB
  # limit; see issue #126).
  javaOpts: "-Xms2g -Xmx2g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=3221225472 -XX:MaxDirectMemorySize=3g"
  # S3 endpoint, bucket, and credentials are auto-wired from the
  # minio section below.
  s3:
    # Local disk cache raised to 200 GiB (214748364800 bytes) for bigann 10M
    # benchmarks. The bigann 10M index (M=16, FusedPQ) produces ~218 segments
    # totalling ~196 GiB of file-server reads — the previous 30 GiB cache was
    # exhausted early in the query phase, causing p999 read latencies of 15.5s
    # as reads fell through to MinIO (see issue #118).
    # NOTE: this key must be under fileServer.s3 — the template reads
    # .Values.fileServer.s3.cacheMaxBytes (not .Values.fileServer.cacheMaxBytes).
    cacheMaxBytes: 214748364800
    # MinIO requires path-style S3 addressing. The chart auto-enables this
    # whenever minio.enabled=true, so setting it here is redundant — kept
    # explicit for parity with examples/gke/values.yaml and so the rendered
    # fileserver.properties clearly shows s3.gcs.compatibility=true.
    gcsCompatibility: true
  storage:
    # 200 GiB: sized to hold the full bigann 10M segment data in the local
    # disk cache without any MinIO fallback on warm queries.
    size: 200Gi
  resources:
    requests:
      memory: "6Gi"
      cpu: "2"
    limits:
      memory: "6Gi"
      cpu: null

minio:
  enabled: true
  storage:
    # 200 GiB: sized for bigann 10M HNSW segments (~196 GiB observed during
    # the 2026-04-16 benchmark run). Previous 20 GiB was sufficient for smaller
    # datasets (gist1m, sift1m, sift10k) but bigann 10M fills it entirely.
    size: 200Gi
  resources:
    # Raised from 256Mi/0.25CPU to 1Gi/1CPU: MinIO was failing its liveness
    # probe (connection refused) during large segment uploads (2+ GiB at peak
    # IS write rate) because its HTTP server became unresponsive under I/O
    # saturation. With only 256 Mi and 0.25 CPU the MinIO process had no
    # headroom for concurrent S3 write handling + health endpoint serving.
    # k8s then restarted it, triggering the IS inflight-write permit leak
    # (issue #575). 1 GiB / 1 CPU gives MinIO enough room to keep the
    # health endpoint alive during sustained write bursts.
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "1Gi"
      cpu: null
  # Liveness/readiness probe tolerances raised for large-segment upload workloads.
  # Default timeoutSeconds=1 / failureThreshold=3 causes spurious restarts when
  # MinIO's HTTP server is briefly unresponsive under sustained S3 write pressure
  # (e.g. IS uploading a 2+ GiB FusedPQ segment). Those restarts trigger the
  # inflight-write permit leak in the IS (issue #575).
  #   timeoutSeconds=30: give MinIO 30 s to respond to the health check while
  #     its goroutines are busy with concurrent write I/O.
  #   failureThreshold=6: require 6 consecutive failures (3 min at period=30)
  #     before declaring the pod dead — transient I/O bursts last at most ~60 s.
  #   periodSeconds=30: less frequent probing reduces liveness-check overhead
  #     during heavy write phases.
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 6
  readinessProbe:
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6

zookeeper:
  enabled: true
  # 512m heap + 512m direct + ~512m JVM overhead (metaspace, code cache,
  # thread stacks, GC structures) = ~1.5 g → container = 2 GiB.
  # (The previous 768Mi limit was too small: it did not account for
  # MaxDirectMemorySize=512m or JVM non-heap overhead.)
  javaOpts: "-Xms512m -Xmx512m -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=536870912 -XX:MaxDirectMemorySize=512m"
  storage:
    size: 2Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "0.25"
    limits:
      memory: "2Gi"
      cpu: null

bookkeeper:
  enabled: true
  replicaCount: 1
  # Heap raised to 2 g (from 512 m): 38 k ops/s from 8 ingest threads caused
  # frequent GC pauses on 512 m heap, making the bookie temporarily unavailable.
  # 2 g heap + 1 g direct + 1 GiB JVM overhead = 4 GiB → container = 4 GiB.
  # (The previous 3 GiB limit was too small: it ignored MaxDirectMemorySize=1g,
  # leaving the bookie at OOMKill risk under sustained ingest write pressure.)
  javaOpts: "-Xms2g -Xmx2g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=1073741824 -XX:MaxDirectMemorySize=1g"
  # Enable FINE logging for BK write processors so OperationRejectedException
  # (bookie backpressure) becomes visible. FINE is set only here in the k3s-local
  # values override, not in the baked-in logging.properties in the image.
  loggingProperties: |
    handlers=java.util.logging.ConsoleHandler

    # Default global logging level
    .level= INFO

    # BookKeeper bookie — raised from SEVERE so WARN-level messages are visible:
    # non-writable channels, fenced-ledger warnings, bookie state transitions.
    org.apache.bookkeeper.level=WARNING

    # Enable FINE (= SLF4J DEBUG) only for the two write-processor classes so that
    # OperationRejectedException (backpressure) becomes visible when the bookie
    # storage cannot keep up with the write rate.
    # One log line per rejected addEntry — potentially verbose under sustained
    # back-pressure, but that is the signal needed to diagnose silent write failures.
    org.apache.bookkeeper.proto.WriteEntryProcessorV3.level=FINE
    org.apache.bookkeeper.proto.WriteEntryProcessor.level=FINE

    ############################################################
    # Handler specific properties.
    ############################################################
    # Raised to FINE so the write-processor DEBUG lines above reach the console.
    java.util.logging.ConsoleHandler.level = FINE
    java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
  # Disable bookie journal fsync (journalSyncData=false) for benchmark use.
  # With journalSyncData=true (default), the bookie calls fdatasync() after
  # every journal flush batch — a single fsync during a checkpoint-induced I/O
  # burst can stall for 300+ s, triggering addEntry timeouts and
  # BKNotEnoughBookiesException (issue #164). With journalSyncData=false the
  # bookie acknowledges entries after writing to the OS page cache (no fsync).
  # journalPageCacheFlushIntervalMSec controls how often the page cache is
  # flushed to disk (default: 1000 ms); data is still durably written, just
  # not synchronously confirmed. Risk: on OS crash buffered-but-unsynced journal
  # entries may be lost — acceptable for vector benchmarks.
  extraConfig:
    journalSyncData: "false"
    journalPageCacheFlushIntervalMSec: "1000"
  # Journal PVC raised to 100 Gi (from 1 Gi) for long-running bigann ingests:
  # the 2026-04-17 bigann 100M run saw the ledger PVC hit 16 GB by 27% progress,
  # so the journal also needs significant headroom for in-flight writes and
  # journal rotation during sustained ingest. journalWriteData was previously
  # set to "false" to reduce journal I/O; removed here so the bookie journals
  # payload data (safer durability, and we have plenty of PVC headroom).
  storage:
    journal:
      size: 100Gi
    ledger:
      size: 10Gi
  resources:
    requests:
      memory: "4Gi"
      cpu: "0.25"
    limits:
      memory: "4Gi"
      cpu: null

indexingService:
  enabled: true
  storageMode: remote
  replicaCount: 1
  # Heap: 5 g. Reduced from 7 g by 2 g (Run 10, 2026-05-19) to give the kernel
  # more RSS budget for tmpfs compaction output files, which are counted in the
  # cgroup memory and caused OOMKill at 36.7M vectors in Run 9 (#597). With -Xmx5g
  # the JVM will throw OutOfMemoryError before the container hits the 26 GiB limit,
  # giving GC a chance to recover rather than being killed immediately.
  #
  # Container RSS budget at -Xmx5g:
  #   JVM heap:            5 GiB
  #   Netty direct:        8 GiB (Dio.netty.maxDirectMemory=8589934592)
  #   JVM overhead:        1 GiB (metaspace, code cache, thread stacks)
  #   tmpfs/compaction:   12 GiB headroom (was ~10 GiB at -Xmx7g)
  #   Total peak:         26 GiB → matches container limit
  #
  # Netty direct budget (unchanged):
  #   SegmentBlockCache:   4 GiB (pooled direct ByteBufs, live at all times)
  #   Phase B write arena: 0.5 GiB (capped at remote.file.client.max.inflight.write.bytes=512 MiB)
  #   Phase C read arena:  ≤2 GiB
  #   gRPC / network:      1 GiB
  #   Slack:               0.5 GiB
  #   Total peak:          8 GiB → maxDirectMemory=8589934592 (8 GiB)
  #
  # -XX:MaxDirectMemorySize=8g: JVM cap for ByteBuffer.allocateDirect() (non-Netty
  #   paths only). Netty bypasses this via Unsafe.allocateMemory (issue #253).
  # herddb.commitlog.tailbatchsize=1000 caps the BK read batch per followTheLeader()
  # call in the IS tailer (issue #180).
  javaOpts: "-Xms5g -Xmx5g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -Dio.netty.maxDirectMemory=8589934592 -XX:MaxDirectMemorySize=8g -Dherddb.commitlog.tailbatchsize=1000 -Dherddb.vectorindex.streamingCompactionEnabled=true -Dherddb.vectorindex.searchAsyncPipelineEnabled=true"
  storage:
    data:
      size: 5Gi
    log:
      size: 2Gi
  # SegmentBlockCache: raised from the auto-size default (maxMemory/4 = 1.75 GiB)
  # to 2.5 GiB for gist1m and similar large-segment workloads.
  # With 21 segments × ~583 MB/segment = 12.24 GiB total (gist1m M=16 FusedPQ),
  # 2.5 GiB holds ~4.4 segments (21%) in cache.
  #
  # Previously set to 3.5 GiB (maxMemory/2), but that caused OutOfMemoryError
  # during the k=100 query phase (issue #246): Phase C loading 7 × 583 MB segments
  # via 4 MB gRPC chunks grew the Netty PoolChunk arena to ~6 GB (1,527 PoolChunks
  # × 4 MB = 6.1 GB), matching MaxDirectMemorySize=6g exactly. With cache at 3.5 GiB
  # direct + Phase C arena at 6 GB, new 4 MB readFileRange buffers could not be
  # allocated in the query phase.
  #
  # Budget check (MaxDirectMemorySize=8g; maxDirectMemory=8g > 0 so Netty uses
  # Unsafe.allocateMemory — freed Phase C chunks are immediately subtracted from
  # Netty's internal AtomicLong counter, no phantom-ref GC dependency; issue #253):
  #   SegmentBlockCache: 2.5 GiB direct (live, in Netty pool)
  #   Phase B peak arena:  2.0 GiB (parallel shard writes, 4 MiB blocks × inflight)
  #   Phase C peak arena:  4.0 GiB (1,015 × 4 MB chunks) — freed on Phase C exit
  #   Search gRPC headroom: 5.5 GiB (8g - 2.5g cache) for concurrent reads ✓
  #   Heap (7g) + direct (8g) + JVM overhead (1g) = 16g JVM + native ≤ 22g ✓
  extraConfig:
    # BookKeeper V2 wire protocol — mirrors the server setting above.
    # The IS reads BK ledgers as a commit-log tailer; enabling V2 here
    # removes protobuf overhead from every readEntries call.
    bookkeeper.useV2WireProtocol: "true"
    indexing.vector.segmentPageCacheMaxBytes: "4294967296"    # 4 GiB (reduced from 8 GiB; OOMKill at 19M/50M bigann push — 8 GiB cache + concurrent Phase B uploads exceeded 26 GiB container limit, issue #580)
    # Caps bytes across in-flight readFile/readFileRange gRPC calls that
    # allocate a pooled direct ByteBuf to bound peak Netty PoolArena growth
    # during Phase C checkpoint loads (issue #246). Default 256 MiB peak
    # in-flight direct-memory footprint, leaving ~4 GiB of the 6 GiB
    # MaxDirectMemorySize budget for the SegmentBlockCache and steady-state
    # gRPC transport. Bytes (not request count) so 16 KiB block reads from
    # RemoteRandomAccessReader and 4 MiB Phase-C chunks both contribute in
    # proportion to the direct-memory pressure they impose. Lower this
    # (e.g. "134217728" = 128 MiB) on tighter bench profiles.
    remote.file.client.max.inflight.read.bytes: "268435456"
    # Caps bytes across in-flight writeFile/writeFileBlock/writeMultipartFile
    # calls (issue #468). Set tighter than the read cap to bias the
    # constrained k3s-local profile toward search reads: when Phase B
    # compaction streams a 658 MB graph + 326 MB map file via 4 MiB blocks,
    # 64 MiB caps the queue at 16 in-flight blocks (vs. ~165 unbounded)
    # so concurrent ANN reads are not starved on the shared event-loop
    # pool / file server.
    remote.file.client.max.inflight.write.bytes: "536870912"   # 512 MiB (raised from 64 MiB; Run 7 showed the 64 MiB cap stalled the IS tailer for 10+ min during Phase B concurrent segment uploads)
    # BookKeeper V2 wire protocol for the IS commit-log tailer (no protobuf framing
    # on readEntries). Code-level default since issue #392; kept here explicitly
    # for parity with the GKE example. Set to "false" to fall back to V3.
    bookkeeper.useV2WireProtocol: "true"
    # Live-graph (in-memory HNSW shard) size set to 100,000 vectors per shard.
    # Larger shards produce fewer, larger segments compared to 50k, reducing the
    # total number of IS-local compaction cycles during bigann-100M ingest.
    # At 100k vectors/shard the jvector OnDiskGraphIndexCompactor finishes each
    # merge in reasonable time while keeping segment count well below the
    # back-pressure threshold (80) with the optimizer enabled.
    # Memory impact: bigann 128-dim, M=16 → ~100k × (16×2×4 B edges + 128×4 B
    # vector) = ~64 MB heap per live shard (well within the 7g IS heap budget).
    indexing.vector.maxLiveGraphSize: "100000"
    # Cap segment count at 40 to force aggressive compaction and keep
    # memory pressure well below the segmentPageCacheMaxBytes limit.
    # At 149 segments the IS was operating with only 521 bytes of headroom
    # in its memory estimator (issues #580, #581). Lowering to 40 limits the
    # steady-state Caffeine cache footprint to ~40 segments and gives the
    # compaction loop much more headroom to merge before back-pressure fires.
    vector.index.compaction.backpressure.segments: "2147483647"
    # Per-cycle download budget for streaming compaction (issue #602).
    # The IS data PVC is 5 GiB; cap at 4 GiB to leave ~1 GiB headroom for
    # the compaction output (merged graph + map) and IS working files.
    indexing.vector.compaction.maxInputBytes: "4294967296"        # 4 GiB
    # Global vector memory budget: default 33% of MaxDirectMemorySize (8 GiB) = 2.64 GiB.
    # Previously raised to 60% as a workaround for the BLink snapshot over-counting bug
    # (issue #592). Fix merged in PR #594 — the override is no longer needed and is
    # reverted here for Run 9. With accurate 16 B/vector accounting, 50M × 16 B = 800 MB
    # is well within the 33% × 8 GiB = 2.64 GiB limit.
  resources:
    requests:
      memory: "26Gi"
      cpu: "8"
    limits:
      memory: "26Gi"
      cpu: null

indexOptimizer:
  enabled: false
  # Human-readable tablespace name — UUID resolved from ZooKeeper at startup.
  # No manual UUID log-scraping required.
  tablespaceName: "herd"
  # Periodic safety-net interval. Issue #484 made the optimizer event-driven
  # via a ZK persistent-recursive watch, so the periodic cadence is only a
  # fallback for the rare case ZK delivers no event. 5 min is fine for bench
  # workloads; production may want longer.
  intervalMs: 300000
  # Memory budget for gist1m M=16 merges (issue #499 Bug 1).
  #
  # For a full 8-segment gist1m merge (8 × ~125k vectors, 960-dim):
  #   PQ codebook retraining reservoir: 128k samples × 960 × 4 B = ~470 MB
  #   jvector OnDiskGraphIndexCompactor: streaming batch compaction (~128 nodes/batch)
  #   JVM overhead (code cache, metaspace, thread stacks): ~500 MB
  # Observed peak with -Xmx6g: JVM RSS reached 5–7 GiB → kernel OOMKill (exit 137)
  # during large compaction (2720/2735 batches) or upload phase.
  #
  # Reducing to -Xmx2g forces the JVM to throw OutOfMemoryError (catchable)
  # rather than being killed by the kernel. If the compaction algorithm is
  # streaming, 2 GiB may be sufficient; we investigate to find the floor.
  #
  #   -Xms512m (lazy init): heap grows on demand during PQ retraining
  #   -Xmx2g: heap ceiling — JVM OOM preferred over kernel OOMKill
  #   --add-modules jdk.incubator.vector: Panama Vector API for SIMD kernels
  #   -XX:MaxDirectMemorySize=1g: cap for non-Netty JVM direct buffers
  #   -Djava.net.preferIPv4Stack=true: avoids IPv6 resolution in k3s-local
  # k3s-local memory budget: node allocatable ≈ 61.57 GiB; other pods consume
  # ~59.25 GiB in requests, leaving only ~2.3 GiB for the optimizer request.
  # Set request=2Gi (scheduling) / limit=12Gi (container ceiling).
  #
  # Why limit=12Gi with -Xmx2g:
  #   JVM heap (max 2g) + direct (1g) + JVM overhead (~0.5g) = 3.5 GiB JVM RSS
  #   /tmp compacted graph file: up to 3.1 GiB (tmpfs, counted by cgroup)
  #   /tmp compacted map file:   up to 1.6 GiB (tmpfs, counted by cgroup)
  #   Input segment page-cache: up to 4–5 GiB during streaming compaction
  #   Peak without limit headroom → kernel OOMKill at 8 GiB ceiling.
  #   12 GiB gives ~4 GiB slack for page-cache eviction to run before kill.
  #
  # Observed OOMKill sequence (gist1m M=16, 1M × 960-dim):
  #   limit=8Gi:  400k-vector merge OOMKilled 1s after map upload
  #               (RSS ~1 GiB + /tmp 4.6 GiB cgroup-counted → over limit)
  #   limit=12Gi: 400k-vector merge SUCCEEDED (RSS peak ~5.8 GiB during compaction)
  #   limit=12Gi: 600k-vector merge OOMKilled during compaction
  #               (RSS ~5.8 GiB at 49% batches + /tmp growing + page cache → over limit)
  # Pattern: each successive merge is larger (2 merged segments = 2× the vectors).
  # The full 1M-vector final merge (3 input segments merged at once) requires
  # > 20 GiB (cgroup-counted):
  #   JVM RSS: ~4.6 GiB (anonymous, cannot be evicted)
  #   /tmp output graph: ~7.8 GiB (file cache, evicted only after upload)
  #   /tmp output map: ~3.9 GiB (sequential with graph, after upload)
  #   Input page cache: ~6.5 GiB (for 600k-vector segment being read)
  #   Overlap at 94% batches: JVM + /tmp_graph + residual_page_cache > 20 GiB
  # Set limit=28Gi to accommodate the full 1M convergence merge.
  # Kernel reclaims file-backed pages aggressively, so host RAM is not exhausted.
  remoteFileClient:
    # Raised from 256 MiB default to 512 MiB to match the IS write-buffer bump.
    # Run 7 showed the 64 MiB IS write cap stalled Phase B uploads; the optimizer
    # merges much larger segments and needs at least as much write headroom.
    maxInflightWriteBytes: "536870912"   # 512 MiB
  javaOpts: "-Xms512m -Xmx2g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -XX:MaxDirectMemorySize=1g"
  resources:
    requests:
      memory: "2Gi"
      cpu: "2"
    limits:
      memory: "28Gi"
      cpu: null

tools:
  enabled: true
  storage:
    datasets:
      # Raised from 10Gi to 30Gi for bigann 200M longevity benchmark:
      # 200M × 128-dim bvecs (uint8) = 25.6 GB on-disk + queries/ground-truth overhead.
      size: 30Gi
  # Heap raised to 6 g: sift10m base set (10M × 128-dim × 4 B = 5.12 GB)
  # must fit in JVM heap during ingest.
  # 6 g heap (max) + 1 g direct + 1 GiB JVM overhead = 8 GiB → container = 8 GiB.
  # (The previous 7 GiB limit ignored MaxDirectMemorySize=1g and was at risk of
  # OOMKill when the JVM expanded to its maximum heap during large dataset ingest.)
  javaOpts: "-Xms512m -Xmx6g -Djava.net.preferIPv4Stack=true -Dio.netty.maxDirectMemory=1073741824 -XX:MaxDirectMemorySize=1g"
  resources:
    requests:
      memory: "8Gi"
      cpu: "0.5"
    limits:
      memory: "8Gi"
      cpu: null

pushIndexingMode:
  # Enable gRPC push mode: VectorBench serializes commit-log entries itself and
  # pushes them straight into the indexing service over the PushEntries gRPC RPC.
  # When enabled, herddb-server and herddb-bookkeeper are rendered at 0 replicas.
  # ZooKeeper, file server, index optimizer, MinIO, tools and IS pods stay up.
  # The IS runs with indexing.log.type=push.
  enabled: true

prometheus:
  # Disabled by default to save ~512 Mi RAM during vector benchmarks.
  # Re-enable with: --set prometheus.enabled=true
  enabled: false
  storage:
    size: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.1"
    limits:
      memory: "512Mi"
      cpu: null

grafana:
  # Disabled by default to save ~256 Mi RAM during vector benchmarks.
  # Re-enable with: --set grafana.enabled=true
  enabled: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "0.1"
    limits:
      memory: "256Mi"
      cpu: null
