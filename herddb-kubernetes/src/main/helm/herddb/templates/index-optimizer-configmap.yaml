{{- if .Values.indexOptimizer.enabled }}
{{- if not .Values.indexOptimizer.tablespaceName }}
{{- fail ".Values.indexOptimizer.tablespaceName is required when indexOptimizer.enabled=true" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "herddb.fullname" . }}-index-optimizer-config
  labels:
    {{- include "herddb.labels" . | nindent 4 }}
    app.kubernetes.io/component: index-optimizer
data:
  indexoptimizer.properties: |
    indexoptimizer.http.host=0.0.0.0
    indexoptimizer.http.port={{ .Values.indexOptimizer.httpPort | default 9853 | int64 }}
    indexoptimizer.zookeeper.address={{ include "herddb.zkAddress" . }}
    indexoptimizer.zookeeper.session.timeout={{ .Values.indexOptimizer.zkSessionTimeout | default 40000 | int64 }}
    indexoptimizer.zookeeper.path=/herd
    indexoptimizer.tablespace.name={{ .Values.indexOptimizer.tablespaceName }}
    indexoptimizer.interval.ms={{ .Values.indexOptimizer.intervalMs | default 300000 | int64 }}
    indexoptimizer.merge.min.count={{ .Values.indexOptimizer.minCount | default 4 | int64 }}
    indexoptimizer.merge.max.count={{ .Values.indexOptimizer.maxCount | default 200 | int64 }}
    indexoptimizer.merge.min.bytes={{ .Values.indexOptimizer.minBytes | default 268435456 | int64 }}
    indexoptimizer.merge.max.bytes={{ .Values.indexOptimizer.maxBytes | default 1073741824 | int64 }}
    indexoptimizer.merge.target.bytes={{ .Values.indexOptimizer.targetMaxBytes | default 8589934592 | int64 }}
    indexoptimizer.retention.ms={{ .Values.indexOptimizer.retentionMs | default 600000 | int64 }}
    indexoptimizer.event.debounce.ms={{ .Values.indexOptimizer.eventDebounceMs | default 500 | int64 }}
    # Horizontal scalability (step 9): the leader executes tasks alongside
    # producing them by default. Set to false to make the leader a pure
    # scheduler — used by the K8s multi-replica acceptance test to prove a
    # worker pod actually does the merge work, also a legitimate "dedicated
    # scheduler" deployment mode for large clusters.
    indexoptimizer.role.leader.execute.tasks={{ .Values.indexOptimizer.leaderExecuteTasks | default true }}
    # Owner-selection policy. LEAST_LOADED is the production default — picks
    # the indexing-service instance with the lowest current byte footprint
    # so merge outputs distribute across replicas instead of piling onto
    # ordinal 0. Alternatives: FIXED_ZERO (legacy), ROUND_ROBIN, STATIC.
    indexoptimizer.owner.selector.policy={{ .Values.indexOptimizer.ownerSelector.policy | default "LEAST_LOADED" }}
    indexoptimizer.tasks.max.attempts={{ .Values.indexOptimizer.tasks.maxAttempts | default 3 | int64 }}
    indexoptimizer.tasks.orphan.reset.ms={{ .Values.indexOptimizer.tasks.orphanResetMs | default 120000 | int64 }}
    indexoptimizer.tasks.terminal.retention.ms={{ .Values.indexOptimizer.tasks.terminalRetentionMs | default 3600000 | int64 }}
    indexoptimizer.tasks.poison.retention.ms={{ .Values.indexOptimizer.tasks.poisonRetentionMs | default 604800000 | int64 }}
    indexoptimizer.consumer.max.tasks.per.tick={{ .Values.indexOptimizer.consumer.maxTasksPerTick | default 4 | int64 }}
    {{- if .Values.indexOptimizer.indexing }}
    {{- if .Values.indexOptimizer.indexing.numInstances }}
    indexoptimizer.indexing.num.instances={{ .Values.indexOptimizer.indexing.numInstances | int64 }}
    {{- end }}
    {{- end }}
    {{- if .Values.indexOptimizer.merger }}
    {{- with .Values.indexOptimizer.merger }}
    {{- if .dim }}
    indexoptimizer.merge.dim={{ .dim | int64 }}
    {{- end }}
    indexoptimizer.merge.M={{ .M | default 16 | int64 }}
    indexoptimizer.merge.beamWidth={{ .beamWidth | default 100 | int64 }}
    indexoptimizer.merge.neighborOverflow={{ .neighborOverflow | default 1.2 }}
    indexoptimizer.merge.alpha={{ .alpha | default 1.4 }}
    indexoptimizer.merge.similarity={{ .similarity | default "DOT_PRODUCT" }}
    {{- end }}
    {{- end }}
    {{- if .Values.indexOptimizer.remoteFileClient }}
    {{- with .Values.indexOptimizer.remoteFileClient }}
    {{- if .servers }}
    indexoptimizer.remote.file.servers={{ .servers }}
    {{- end }}
    indexoptimizer.remote.file.client.timeout={{ .timeoutSeconds | default 60 | int64 }}
    indexoptimizer.remote.file.client.retries={{ .retries | default 3 | int64 }}
    indexoptimizer.remote.file.client.max.inflight.read.bytes={{ .maxInflightReadBytes | default 268435456 | int64 }}
    indexoptimizer.remote.file.client.max.inflight.write.bytes={{ .maxInflightWriteBytes | default 268435456 | int64 }}
    {{- end }}
    {{- end }}
    {{- if and .Values.indexOptimizer.s3 .Values.indexOptimizer.s3.directEnabled }}
    # Direct S3/GCS access for streaming compaction (issue #609). When
    # enabled, the optimizer downloads input segment graph/map files
    # directly from object storage instead of routing every block through
    # the gRPC file-server. S3_ACCESS_KEY / S3_SECRET_KEY env vars are
    # injected by the StatefulSet from .Values.indexOptimizer.s3.credentialsSecret.
    indexoptimizer.s3.direct.enabled=true
    {{- if .Values.indexOptimizer.s3.endpoint }}
    indexoptimizer.s3.endpoint={{ .Values.indexOptimizer.s3.endpoint }}
    {{- end }}
    {{- if .Values.indexOptimizer.s3.bucket }}
    indexoptimizer.s3.bucket={{ .Values.indexOptimizer.s3.bucket }}
    {{- end }}
    indexoptimizer.s3.region={{ .Values.indexOptimizer.s3.region | default "us-east-1" }}
    {{- if .Values.indexOptimizer.s3.prefix }}
    indexoptimizer.s3.prefix={{ .Values.indexOptimizer.s3.prefix }}
    {{- end }}
    {{- if .Values.indexOptimizer.s3.gcsCompatibility }}
    indexoptimizer.s3.gcs.compatibility=true
    {{- end }}
    s3.crt.max.concurrency={{ .Values.indexOptimizer.s3.crtMaxConcurrency | default 4 | int64 }}
    s3.crt.read.buffer.size={{ .Values.indexOptimizer.s3.crtReadBufferSize | default 1073741824 | int64 }}
    {{- end }}
    {{- range $k, $v := .Values.indexOptimizer.extraConfig }}
    {{ $k }}={{ $v }}
    {{- end }}
{{- if .Values.indexOptimizer.loggingProperties }}
  logging.properties: |
{{ .Values.indexOptimizer.loggingProperties | indent 4 }}
{{- end }}
{{- end }}
