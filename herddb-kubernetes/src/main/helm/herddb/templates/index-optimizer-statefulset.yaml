{{- if .Values.indexOptimizer.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "herddb.fullname" . }}-index-optimizer
  labels:
    {{- include "herddb.labels" . | nindent 4 }}
    app.kubernetes.io/component: index-optimizer
spec:
  # Horizontal scalability (step 9): replicas is templated. Pod ordinal 0 is
  # the leader (selects merge candidates, enqueues tasks). Ordinals 1..N-1 are
  # workers (consume tasks only). With replicas=1 the single pod is both
  # leader and worker. Behaviour at the cluster level is equivalent across
  # 1 vs N replicas — adding workers just adds merge throughput.
  replicas: {{ .Values.indexOptimizer.replicas | default 1 }}
  serviceName: {{ include "herddb.fullname" . }}-index-optimizer
  # Parallel so a freshly-scaled-up worker pod (e.g. ordinal 2) does not have
  # to wait for ordinal 1 to be Ready before it can start consuming.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "herddb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: index-optimizer
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/index-optimizer-configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.indexOptimizer.httpPort }}"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "herddb.labels" . | nindent 8 }}
        app.kubernetes.io/component: index-optimizer
    spec:
      serviceAccountName: {{ include "herddb.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexOptimizer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexOptimizer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexOptimizer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.zookeeper.enabled }}
      initContainers:
        - name: wait-for-zookeeper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Waiting for ZooKeeper at {{ include "herddb.zkAddress" . }}..."
              {{- $zkHost := printf "%s-zookeeper-0.%s-zookeeper.%s.svc.cluster.local"
                    (include "herddb.fullname" .)
                    (include "herddb.fullname" .)
                    .Release.Namespace }}
              while ! echo ruok > /dev/tcp/{{ $zkHost }}/{{ .Values.zookeeper.clientPort }} 2>/dev/null; do
                echo "ZooKeeper not ready, retrying in 2s..."
                sleep 2
              done
              echo "ZooKeeper is ready."
      {{- end }}
      containers:
        - name: index-optimizer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec /opt/herddb/bin/service index-optimizer console \
                /opt/herddb/conf/indexoptimizer.properties \
                -Dindexoptimizer.tmp.dir=/opt/herddb/optimizer-tmp
          env:
            # Pod ordinal sourced from the K8s downward API
            # (apps.kubernetes.io/pod-index label; K8s >= 1.28). Consumed by
            # OptimizerRole.detect to decide LEADER (ordinal 0) vs WORKER.
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            # Fallback for the hostname-regex role detection when the
            # downward-API field is unavailable.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.indexOptimizer.javaOpts }}
            - name: JAVA_OPTS
              value: {{ .Values.indexOptimizer.javaOpts | quote }}
            {{- end }}
            {{- if .Values.indexOptimizer.javaOptsExtra }}
            - name: JAVA_OPTS_EXTRA
              value: {{ .Values.indexOptimizer.javaOptsExtra | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.indexOptimizer.httpPort | default 9853 }}
              protocol: TCP
          # Liveness + readiness probes against the JDK HttpServer admin endpoint.
          # /health unconditionally returns 200 (issue #504) so a long merge tick
          # cannot race the kubelet's failureThreshold and trigger a SIGKILL, and
          # a transient ZK session expiry is recovered in-process via
          # IndexOptimizerMain.reconnectZooKeeper() rather than a pod restart.
          # Engine staleness alerting belongs on the
          # herddb_optimizer_last_run_at_seconds gauge from /metrics.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.indexOptimizer.httpPort | default 9853 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.indexOptimizer.httpPort | default 9853 }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.indexOptimizer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /opt/herddb/optimizer-tmp
            - name: config
              mountPath: /opt/herddb/conf/indexoptimizer.properties
              subPath: indexoptimizer.properties
            {{- if .Values.indexOptimizer.loggingProperties }}
            - name: config
              mountPath: /opt/herddb/conf/logging.properties
              subPath: logging.properties
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "herddb.fullname" . }}-index-optimizer-config
  volumeClaimTemplates:
    - metadata:
        name: tmp
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.indexOptimizer.storage.tmp.storageClass }}
        storageClassName: {{ .Values.indexOptimizer.storage.tmp.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.indexOptimizer.storage.tmp.size }}
{{- end }}
