{{- if .Values.indexingService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "herddb.fullname" . }}-indexing-service-config
  labels:
    {{- include "herddb.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexing-service
data:
  indexingservice.properties: |
    port={{ .Values.indexingService.port }}
    bind.host=0.0.0.0
    indexing.storage.type={{ .Values.indexingService.storageMode | default "file" }}
    indexing.http.enable=true
    indexing.http.port={{ .Values.indexingService.httpPort }}
    indexing.http.host=0.0.0.0
    {{- if eq .Values.server.mode "cluster" }}
    server.mode=cluster
    server.zookeeper.address={{ include "herddb.zkAddress" . }}
    server.zookeeper.path=/herd
    server.zookeeper.session.timeout={{ .Values.indexingService.zkSessionTimeout }}
    indexing.log.type=bookkeeper
    server.bookkeeper.ledgers.path=/ledgers
    {{- end }}
    {{- if .Values.indexOptimizer.enabled }}
    # Issue #491: when the external index-optimizer service is enabled, the IS
    # MUST publish every freshly-emitted segment to the ZK segment registry,
    # otherwise the optimizer observes zero indexes. Auto-derived from
    # indexOptimizer.enabled so operators do not have to keep two flags in sync.
    # Side-effect: this also flips the per-store IS-local compaction loop into
    # pressure-driven fallback mode (kickFraction × backpressure cap) so the
    # optimizer drives steady-state compaction. Override per-store via
    # vector.index.compaction.local.enabledWithOptimizer / .local.kick.fraction.
    indexing.optimizer.enabled=true
    {{- end }}
    {{- if and .Values.indexingService.s3 .Values.indexingService.s3.directEnabled }}
    indexing.s3.direct.enabled=true
    {{- if .Values.indexingService.s3.endpoint }}
    indexing.s3.endpoint={{ .Values.indexingService.s3.endpoint }}
    {{- end }}
    {{- if .Values.indexingService.s3.bucket }}
    indexing.s3.bucket={{ .Values.indexingService.s3.bucket }}
    {{- end }}
    indexing.s3.region={{ .Values.indexingService.s3.region | default "us-east-1" }}
    {{- if .Values.indexingService.s3.prefix }}
    indexing.s3.prefix={{ .Values.indexingService.s3.prefix }}
    {{- end }}
    {{- if .Values.indexingService.s3.gcsCompatibility }}
    indexing.s3.gcs.compatibility=true
    {{- end }}
    {{- end }}
    {{- range $k, $v := .Values.indexingService.extraConfig }}
    {{ $k }}={{ $v }}
    {{- end }}
{{- if .Values.indexingService.loggingProperties }}
  logging.properties: |
{{ .Values.indexingService.loggingProperties | indent 4 }}
{{- end }}
{{- end }}
