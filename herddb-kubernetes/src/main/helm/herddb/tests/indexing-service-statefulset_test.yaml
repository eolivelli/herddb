suite: indexing-service StatefulSet
templates:
  - templates/indexing-service-statefulset.yaml
  - templates/indexing-service-configmap.yaml
tests:
  - it: should have a checksum/config annotation that rolls pods on ConfigMap changes
    template: templates/indexing-service-statefulset.yaml
    set:
      indexingService.enabled: true
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[a-f0-9]{64}$

  - it: should use default liveness probe values when livenessProbe is not overridden
    template: templates/indexing-service-statefulset.yaml
    set:
      indexingService.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3

  - it: should apply custom liveness probe values when livenessProbe is overridden
    template: templates/indexing-service-statefulset.yaml
    set:
      indexingService.enabled: true
      indexingService.livenessProbe.initialDelaySeconds: 60
      indexingService.livenessProbe.periodSeconds: 30
      indexingService.livenessProbe.failureThreshold: 20
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 60
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 20

  # Issue #350 — server.zookeeper.session.timeout for the indexing-service is
  # configurable via indexingService.zkSessionTimeout (default 40000 ms).
  - it: should default zk session timeout to 40000 in the IS ConfigMap
    template: templates/indexing-service-configmap.yaml
    set:
      indexingService.enabled: true
      server.mode: cluster
    asserts:
      - matchRegex:
          path: data["indexingservice.properties"]
          pattern: "server\\.zookeeper\\.session\\.timeout=40000"

  - it: should honour overridden indexingService.zkSessionTimeout
    template: templates/indexing-service-configmap.yaml
    set:
      indexingService.enabled: true
      server.mode: cluster
      indexingService.zkSessionTimeout: 90000
    asserts:
      - matchRegex:
          path: data["indexingservice.properties"]
          pattern: "server\\.zookeeper\\.session\\.timeout=90000"
      - notMatchRegex:
          path: data["indexingservice.properties"]
          pattern: "server\\.zookeeper\\.session\\.timeout=40000"

  - it: should omit zk session timeout when not in cluster mode
    template: templates/indexing-service-configmap.yaml
    set:
      indexingService.enabled: true
      server.mode: standalone
    asserts:
      - notMatchRegex:
          path: data["indexingservice.properties"]
          pattern: "server\\.zookeeper\\.session\\.timeout"
