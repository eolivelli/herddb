image:
  repository: herddb/herddb-server
  tag: "0.30.0-SNAPSHOT"
  pullPolicy: IfNotPresent
  # Secrets for pulling from private registries (e.g. ghcr.io).
  # Each entry must have a "name" key matching a docker-registry Secret.
  pullSecrets: []
  # - name: ghcr-credentials

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Override the generated name
  name: ""

# HerdDB server (JDBC endpoint + metadata)
server:
  # Server mode: "standalone" or "cluster"
  mode: standalone
  # Storage mode: "local" or "remote"
  storageMode: remote
  replicaCount: 1
  port: 7000
  httpPort: 9845
  # JVM options. REPLACES the default JAVA_OPTS from setenv.sh — use only when
  # you need to change the baseline (GC, heap, -D properties). Note: when set,
  # you lose the defaults (-XX:+UseG1GC, -Xmx4g, -XX:MaxDirectMemorySize=1g, ...).
  # Prefer javaOptsExtra below unless you really want to replace the baseline.
  javaOpts: ""
  # Extra JVM options APPENDED to the defaults from setenv.sh. Use this to add
  # flags (e.g. "-Xmx8g -XX:+AlwaysPreTouch") without losing the baseline or
  # the jvector-required --add-modules jdk.incubator.vector. Safe default.
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image.
  # Paste the full file content as a multiline YAML string to override without
  # rebuilding the image. The ConfigMap checksum annotation ensures a rolling
  # restart when this value changes.
  loggingProperties: ""
  # Extra key=value entries appended to server.properties
  extraConfig: {}
  # PodDisruptionBudget — blocks voluntary node evictions (cluster-autoscaler
  # scale-down, kubectl drain) so that a single-replica server cannot be
  # involuntarily killed mid-operation. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  storage:
    data:
      size: 10Gi
      storageClass: ""
    # commitlog PVC is only provisioned when storageMode: local.
    # When storageMode: remote (the default), HerdDB uses BookKeeper as its
    # write-ahead log and the local commitlog directory is not written to,
    # so no PVC is created.
    commitlog:
      size: 5Gi
      storageClass: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "4"
    limits:
      memory: "1Gi"
      cpu: "4"

# RemoteFileServer (gRPC page storage)
fileServer:
  replicaCount: 2
  port: 9846
  httpPort: 9847
  # See server.javaOpts / server.javaOptsExtra above for the replace-vs-append
  # semantics. Prefer javaOptsExtra unless you really want to replace.
  javaOpts: ""
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image
  # (or JUL built-in defaults when the whole conf dir is ConfigMap-mounted).
  loggingProperties: ""
  # Storage backend: "local" (default) or "s3"
  storageMode: local
  # S3 / MinIO configuration (used when storageMode=s3)
  s3:
    # Endpoint URL — leave empty for AWS S3, set for MinIO or compatible services.
    # When minio.enabled=true this is auto-set to the in-cluster MinIO service.
    endpoint: ""
    # Bucket name. When minio.enabled=true defaults to minio.bucket.
    bucket: ""
    region: "us-east-1"
    # Credentials. When minio.enabled=true defaults to minio.adminUser/adminPassword.
    accessKey: ""
    secretKey: ""
    # Name of an existing Kubernetes Secret containing S3_ACCESS_KEY and
    # S3_SECRET_KEY entries. When set, credentials are read from the Secret
    # instead of from accessKey/secretKey above.
    credentialsSecret: ""
    # Optional key prefix within the bucket
    prefix: ""
    # Local disk cache size in bytes (default 1 GB). The PVC is always used as cache dir.
    cacheMaxBytes: 1073741824
    # Enable GCS-compatibility tweaks on the S3 client:
    #  - path-style addressing (required by GCS and MinIO)
    #  - disable SDK v2 default request/response checksums (GCS rejects them)
    # Default false = behave as a standard AWS S3 client. Auto-enabled when
    # minio.enabled=true (the in-cluster MinIO also needs path-style addressing).
    gcsCompatibility: false
  storage:
    size: 10Gi
    storageClass: ""
  extraConfig: {}
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "4"
    limits:
      memory: "1Gi"
      cpu: "4"

# Optional in-cluster MinIO instance (single-replica, for development / testing).
# When enabled together with fileServer.storageMode=s3, the file server is
# automatically pre-configured to connect to this instance.
minio:
  enabled: false
  adminUser: minioadmin
  adminPassword: minioadmin
  port: 9000
  # Bucket created on startup (used as default s3.bucket for the file server)
  bucket: herddb-pages
  storage:
    size: 10Gi
    storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "512Mi"
      cpu: "0.5"

# Optional in-cluster ZooKeeper instance for cluster mode.
zookeeper:
  enabled: false
  replicaCount: 1
  clientPort: 2181
  metricsPort: 7070
  # ZK 3.6+ AdminServer HTTP port. Used by the pod's readiness/liveness
  # probes via /commands/ruok so the probe doesn't TCP-connect on the
  # binary client port (which generates `session = 0x0` log spam — see
  # issue #211).
  adminPort: 8080
  javaOpts: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image.
  loggingProperties: ""
  storage:
    size: 2Gi
    storageClass: ""
  # PodDisruptionBudget — strongly recommended for ZooKeeper. The original
  # motivation for the chart-wide PDB knob was a GKE cluster-autoscaler
  # scale-down event that evicted herddb-zookeeper-0 and expired all client
  # sessions, permanently losing a tablespace (issue #332). Disabled by
  # default to keep the standalone helm install drainable; enable in any
  # cluster-mode deployment.
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.5"
    limits:
      memory: "256Mi"
      cpu: "0.5"

# Optional BookKeeper bookie for cluster mode (requires zookeeper.enabled=true).
bookkeeper:
  enabled: false
  replicaCount: 1
  bookiePort: 3181
  httpPort: 8000
  # See server.javaOpts / server.javaOptsExtra above for the replace-vs-append
  # semantics. Prefer javaOptsExtra unless you really want to replace.
  javaOpts: ""
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image.
  loggingProperties: ""
  storage:
    journal:
      size: 2Gi
      storageClass: ""
    ledger:
      size: 5Gi
      storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "512Mi"
      cpu: "0.5"
  extraConfig: {}

# Optional IndexingService for vector search (requires zookeeper.enabled=true
# and bookkeeper.enabled=true in cluster mode).
indexingService:
  enabled: false
  replicaCount: 2
  port: 9850
  httpPort: 9851
  # Storage mode: "file" (local), "memory" (testing), or "remote" (remote file server via ZK)
  storageMode: file
  # See server.javaOpts / server.javaOptsExtra above for the replace-vs-append
  # semantics. Prefer javaOptsExtra unless you really want to replace.
  #
  # Direct-memory budget under storageMode=remote:
  #   -XX:MaxDirectMemorySize must accommodate:
  #     - SegmentBlockCache (default: -Xmx/4, all pooled direct ByteBufs)
  #     - Phase C checkpoint peak (Netty PoolArena growth from readFileRange
  #       chunks; capped by remote.file.client.max.inflight.read.bytes)
  #     - steady-state gRPC transport (~256 MiB)
  #   Bench-validated baseline: MaxDirectMemorySize=10g for -Xmx=24g with
  #   remote.file.client.max.inflight.read.bytes=256 MiB (issue #246).
  javaOpts: ""
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image
  # (or JUL built-in defaults when the whole conf dir is ConfigMap-mounted).
  loggingProperties: ""
  storage:
    data:
      size: 10Gi
      storageClass: ""
    log:
      size: 5Gi
      storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "4"
    limits:
      memory: "1Gi"
      cpu: "4"

# Tools pod — sleep + pre-configured CLI for kubectl exec.
# Runs as a StatefulSet with a persistent PVC for vector benchmark datasets.
tools:
  enabled: true
  # JVM options for the CLI (defaults to lightweight settings)
  javaOpts: ""
  # Port for the embedded VectorBench admin HTTP API (GET /status,
  # POST /ingestion/config/ingest-max-ops, etc.).  Passed to the JVM
  # as -Dvectorbench.admin.port=<N> via VECTORBENCH_ADMIN_PORT env var.
  # Set to "0" or a negative value to disable the admin API.
  adminPort: "8080"
  # PodDisruptionBudget — prevents voluntary node evictions (e.g. GKE Autopilot
  # scale-down) from killing the tools pod mid-benchmark. Enabled by default
  # when tools is enabled. Set to false only for short-lived / disposable runs.
  pdb:
    enabled: true
    minAvailable: 1
  gcs:
    # Kubernetes Secret containing GCS HMAC credentials (keys: S3_ACCESS_KEY, S3_SECRET_KEY).
    # When set, the tools pod can download datasets from gs:// URLs using the S3-compatible API.
    credentialsSecret: ""
    # Optional default datasets bucket. When set, the tools pod gets
    # VECTORBENCH_DATASETS_BUCKET=gs://<name> so scripts and the
    # benchmark can default custom --dataset-url prefixes without
    # hard-coding the bucket name.
    datasetsBucket: ""
  storage:
    datasets:
      size: 30Gi
      storageClass: ""
      # When set, uses a hostPath volume instead of a PVC.
      # The path must exist on the Kubernetes node (or the k3s container).
      hostPath: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.5"
    limits:
      memory: "256Mi"
      cpu: "0.5"


# Optional Prometheus instance for scraping HerdDB metrics.
prometheus:
  enabled: false
  image:
    repository: prom/prometheus
    tag: "v2.53.0"
  port: 9090
  storage:
    size: 10Gi
    storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "512Mi"
      cpu: "0.5"

# Optional Grafana instance with pre-provisioned HerdDB dashboards.
grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: "11.1.0"
  port: 3000
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.25"
    limits:
      memory: "256Mi"
      cpu: "0.25"
