image:
  repository: herddb/herddb-server
  tag: "0.30.0-SNAPSHOT"
  pullPolicy: IfNotPresent
  # Secrets for pulling from private registries (e.g. ghcr.io).
  # Each entry must have a "name" key matching a docker-registry Secret.
  pullSecrets: []
  # - name: ghcr-credentials

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Override the generated name
  name: ""

# HerdDB server (JDBC endpoint + metadata)
server:
  # Server mode: "standalone" or "cluster"
  mode: standalone
  # Storage mode: "local" or "remote"
  storageMode: remote
  replicaCount: 1
  port: 7000
  httpPort: 9845
  # JVM options. REPLACES the default JAVA_OPTS from setenv.sh — use only when
  # you need to change the baseline (GC, heap, -D properties). Note: when set,
  # you lose the defaults (-XX:+UseG1GC, -Xmx4g, -XX:MaxDirectMemorySize=1g, ...).
  # Prefer javaOptsExtra below unless you really want to replace the baseline.
  javaOpts: ""
  # Extra JVM options APPENDED to the defaults from setenv.sh. Use this to add
  # flags (e.g. "-Xmx8g -XX:+AlwaysPreTouch") without losing the baseline or
  # the jvector-required --add-modules jdk.incubator.vector. Safe default.
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image.
  # Paste the full file content as a multiline YAML string to override without
  # rebuilding the image. The ConfigMap checksum annotation ensures a rolling
  # restart when this value changes.
  loggingProperties: ""
  # Extra key=value entries appended to server.properties
  extraConfig: {}
  # PodDisruptionBudget — blocks voluntary node evictions (cluster-autoscaler
  # scale-down, kubectl drain) so that a single-replica server cannot be
  # involuntarily killed mid-operation. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  storage:
    data:
      size: 10Gi
      storageClass: ""
    # commitlog PVC is only provisioned when storageMode: local.
    # When storageMode: remote (the default), HerdDB uses BookKeeper as its
    # write-ahead log and the local commitlog directory is not written to,
    # so no PVC is created.
    commitlog:
      size: 5Gi
      storageClass: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "4"
    limits:
      memory: "1Gi"
      cpu: "4"

# RemoteFileServer (gRPC page storage)
fileServer:
  replicaCount: 2
  port: 9846
  httpPort: 9847
  # See server.javaOpts / server.javaOptsExtra above for the replace-vs-append
  # semantics. Prefer javaOptsExtra unless you really want to replace.
  javaOpts: ""
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image
  # (or JUL built-in defaults when the whole conf dir is ConfigMap-mounted).
  loggingProperties: ""
  # Storage backend: "local" (default) or "s3"
  storageMode: local
  # S3 / MinIO configuration (used when storageMode=s3)
  s3:
    # Endpoint URL — leave empty for AWS S3, set for MinIO or compatible services.
    # When minio.enabled=true this is auto-set to the in-cluster MinIO service.
    endpoint: ""
    # Bucket name. When minio.enabled=true defaults to minio.bucket.
    bucket: ""
    region: "us-east-1"
    # Credentials. When minio.enabled=true defaults to minio.adminUser/adminPassword.
    accessKey: ""
    secretKey: ""
    # Name of an existing Kubernetes Secret containing S3_ACCESS_KEY and
    # S3_SECRET_KEY entries. When set, credentials are read from the Secret
    # instead of from accessKey/secretKey above.
    credentialsSecret: ""
    # Optional key prefix within the bucket
    prefix: ""
    # Local disk cache size in bytes (default 1 GB). The PVC is always used as cache dir.
    cacheMaxBytes: 1073741824
    # Enable GCS-compatibility tweaks on the S3 client:
    #  - path-style addressing (required by GCS and MinIO)
    #  - disable SDK v2 default request/response checksums (GCS rejects them)
    # Default false = behave as a standard AWS S3 client. Auto-enabled when
    # minio.enabled=true (the in-cluster MinIO also needs path-style addressing).
    gcsCompatibility: false
  storage:
    size: 10Gi
    storageClass: ""
  # ZooKeeper session timeout (ms) for the file-server's metadata client.
  # Registrations are PERSISTENT (issue #350) so this timeout no longer
  # governs registration liveness — only the latency window over which a
  # session-loss is detected and the client reconnects. Raise it (e.g.
  # 60000–90000 ms) on workloads with frequent long GC pauses or I/O stalls
  # to reduce reconnect churn.
  zkSessionTimeout: 40000
  extraConfig: {}
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "4"
    limits:
      memory: "1Gi"
      cpu: "4"

# Optional in-cluster MinIO instance (single-replica, for development / testing).
# When enabled together with fileServer.storageMode=s3, the file server is
# automatically pre-configured to connect to this instance.
minio:
  enabled: false
  adminUser: minioadmin
  adminPassword: minioadmin
  port: 9000
  # Bucket created on startup (used as default s3.bucket for the file server)
  bucket: herddb-pages
  storage:
    size: 10Gi
    storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "512Mi"
      cpu: "0.5"

# Optional in-cluster ZooKeeper instance for cluster mode.
zookeeper:
  enabled: false
  replicaCount: 1
  clientPort: 2181
  metricsPort: 7070
  # ZK 3.6+ AdminServer HTTP port. Used by the pod's readiness/liveness
  # probes via /commands/ruok so the probe doesn't TCP-connect on the
  # binary client port (which generates `session = 0x0` log spam — see
  # issue #211).
  adminPort: 8080
  javaOpts: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image.
  loggingProperties: ""
  storage:
    size: 2Gi
    storageClass: ""
  # PodDisruptionBudget — strongly recommended for ZooKeeper. The original
  # motivation for the chart-wide PDB knob was a GKE cluster-autoscaler
  # scale-down event that evicted herddb-zookeeper-0 and expired all client
  # sessions, permanently losing a tablespace (issue #332). Disabled by
  # default to keep the standalone helm install drainable; enable in any
  # cluster-mode deployment.
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.5"
    limits:
      memory: "256Mi"
      cpu: "0.5"

# Optional BookKeeper bookie for cluster mode (requires zookeeper.enabled=true).
bookkeeper:
  enabled: false
  replicaCount: 1
  bookiePort: 3181
  httpPort: 8000
  # See server.javaOpts / server.javaOptsExtra above for the replace-vs-append
  # semantics. Prefer javaOptsExtra unless you really want to replace.
  javaOpts: ""
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image.
  loggingProperties: ""
  storage:
    journal:
      size: 2Gi
      storageClass: ""
    ledger:
      size: 5Gi
      storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "512Mi"
      cpu: "0.5"
  extraConfig: {}

# Optional IndexingService for vector search (requires zookeeper.enabled=true
# and bookkeeper.enabled=true in cluster mode).
indexingService:
  enabled: false
  replicaCount: 2
  port: 9850
  httpPort: 9851
  # Storage mode: "file" (local), "memory" (testing), or "remote" (remote file server via ZK)
  storageMode: file
  # See server.javaOpts / server.javaOptsExtra above for the replace-vs-append
  # semantics. Prefer javaOptsExtra unless you really want to replace.
  #
  # Direct-memory budget under storageMode=remote:
  #   -XX:MaxDirectMemorySize must accommodate:
  #     - SegmentBlockCache (default: -Xmx/4, all pooled direct ByteBufs)
  #     - Phase C checkpoint peak (Netty PoolArena growth from readFileRange
  #       chunks; capped by remote.file.client.max.inflight.read.bytes)
  #     - steady-state gRPC transport (~256 MiB)
  #   Bench-validated baseline: MaxDirectMemorySize=10g for -Xmx=24g with
  #   remote.file.client.max.inflight.read.bytes=256 MiB (issue #246).
  #
  # Compaction/search fairness on the write plane (issue #468):
  #   remote.file.client.max.inflight.write.bytes caps bytes across in-flight
  #   writeFile/writeFileBlock/writeMultipartFile calls. Symmetric to the
  #   read cap above — when Phase B compaction streams hundreds of MB of
  #   merged graph + map files, this knob bounds peak write-plane network
  #   pressure so concurrent ANN search reads on the read plane are not
  #   starved on the shared event-loop pool / file server. Default 256 MiB.
  #   Lower this (e.g. "67108864" = 64 MiB) on profiles where compaction
  #   visibly hurts query p99 latency.
  javaOpts: ""
  javaOptsExtra: ""
  # Optional: override /opt/herddb/conf/logging.properties inside the pod.
  # Empty string = use the logging.properties bundled in the Docker image
  # (or JUL built-in defaults when the whole conf dir is ConfigMap-mounted).
  loggingProperties: ""
  storage:
    data:
      size: 10Gi
      storageClass: ""
    log:
      size: 5Gi
      storageClass: ""
  # ZooKeeper session timeout (ms) for the indexing-service's metadata client.
  # Registrations are PERSISTENT (issue #350) so this timeout no longer
  # governs registration liveness — only the latency window over which a
  # session-loss is detected and the client reconnects. Raise it (e.g.
  # 60000–90000 ms) on workloads with frequent long GC pauses or I/O stalls
  # to reduce reconnect churn.
  zkSessionTimeout: 40000
  # Liveness probe tuning for the IS container.
  # During heavy GC / memory-flush cycles (see issue #340) the JVM may starve
  # the Jetty thread pool for 10–30 s.  Raise failureThreshold + periodSeconds
  # in production to avoid false-positive SIGKILL restarts (e.g. 20 × 30 s =
  # 10 min tolerance as used in the GKE example values).
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "4"
    limits:
      memory: "1Gi"
      cpu: "4"
  # Direct S3 download for segment map files during cold-start recovery (issue #381).
  # When enabled, the indexing service connects directly to the S3/GCS bucket to download
  # segment map files, bypassing the gRPC file-server round-trips that dominate cold-start
  # time with thousands of segments. Requires storageMode=remote.
  s3:
    # Set to true to enable direct S3 downloads during index recovery.
    directEnabled: false
    # S3 endpoint URL — leave empty for AWS S3, set for GCS or MinIO.
    # When fileServer.storageMode=s3 this should match fileServer.s3.endpoint.
    endpoint: ""
    # Bucket containing the segment data. Should match fileServer.s3.bucket.
    bucket: ""
    region: "us-east-1"
    # Optional key prefix within the bucket. Should match fileServer.s3.prefix.
    prefix: ""
    # Enable GCS-compatibility tweaks (path-style addressing, WHEN_REQUIRED checksums).
    # Set to true for GCS and MinIO. Should match fileServer.s3.gcsCompatibility.
    gcsCompatibility: false
    # Name of a Kubernetes Secret with S3_ACCESS_KEY and S3_SECRET_KEY entries.
    # When set, the env vars are injected into the indexing-service pods from this secret.
    credentialsSecret: ""

# Index Optimizer — singleton service that takes over vector-index compaction
# from the IS. When indexOptimizer.enabled=true the IS configmap auto-emits
# indexing.optimizer.enabled=true (issue #491) so every IS pod publishes its
# freshly-emitted segments to the ZK segment registry and flips its per-store
# local compaction loop into pressure-driven fallback mode — making the
# external optimizer the steady-state compaction driver. No additional
# indexingService.* flag has to be set in lock-step. Greenfield only:
# existing legacy indexes keep the in-IS compaction path, only newly-created
# segmented-v2 indexes are managed by this service.
indexOptimizer:
  enabled: false
  # Human-readable tablespace name this optimizer manages — REQUIRED when
  # enabled=true (e.g. "herd", the HerdDB default). The optimizer resolves
  # the UUID from ZooKeeper at startup; no manual UUID lookup is needed.
  tablespaceName: ""
  # HTTP admin endpoint port — exposes /health (probe target) and /metrics
  # (Prometheus scrape). Set to 0 to disable.
  httpPort: 9853
  # Periodic safety-net interval for the registry scan. Issue #484 made the
  # optimizer event-driven (a ZK persistent-recursive watch on the registry
  # tablespace path schedules a tick on every children-changed event), so
  # this value can be left long without sacrificing responsiveness — it only
  # fires when ZK has been completely silent for the whole interval.
  intervalMs: 300000
  # Minimum number of mergeable segments. Honoured by the legacy
  # SmallestFirstPolicy; the AggressivePolicy that production runs always
  # fires on ≥2 sub-target segments so this is effectively unused. Retained
  # for backward compatibility.
  minCount: 4
  # Maximum number of segments the optimizer will pick per cycle (cap on
  # write amplification per merge run).
  maxCount: 200
  # Quoted as strings to prevent the Go YAML parser from emitting scientific
  # notation (e.g. 2.68435456e+08) which Java's Long.parseLong cannot parse.
  minBytes: "268435456"   # 256 MiB
  maxBytes: "1073741824"  # 1 GiB — per-cycle byte budget (write-amplification cap)
  # Issue #484: per-graph "graduated" cap. Segments at or above this size
  # are excluded from the merge candidate set. Default 8 GiB so production
  # workloads converge to a single large graph; raise it to drive even
  # larger merges or lower it to tier the graph layout.
  targetMaxBytes: "8589934592"  # 8 GiB
  retentionMs: 600000     # 10 min
  # Issue #484: debounce window for the event-driven path. Bursts of
  # children-changed events from the persistent-recursive watch coalesce
  # into a single tick after this many millis of quiet. 0 disables
  # debouncing.
  eventDebounceMs: 500
  # Issue #484: parameters used by the production RemoteSegmentMerger when
  # it rebuilds a merged graph. The defaults match the IS-side
  # PersistentVectorStore so the merged segment has identical recall
  # characteristics. The vector dimension `dim` MUST be set explicitly when
  # the optimizer is enabled because SegmentMetadata znodes do not carry
  # the dimension as a first-class field.
  merger:
    dim: 0          # REQUIRED when indexOptimizer.enabled=true (e.g. 960 for GIST1M)
    M: 16
    beamWidth: 100
    neighborOverflow: 1.2
    alpha: 1.4
    similarity: "DOT_PRODUCT"  # one of DOT_PRODUCT, COSINE, EUCLIDEAN
  # Issue #484: configuration for the optimizer's connection to the remote
  # file service (used by the merger to download input segment files and
  # upload the merged graph). Empty `servers` means "discover via ZK at
  # /herd/file-servers" — the typical production setup.
  remoteFileClient:
    servers: ""
    timeoutSeconds: 60
    retries: 3
    maxInflightReadBytes: "268435456"   # 256 MiB
    maxInflightWriteBytes: "268435456"  # 256 MiB
  zkSessionTimeout: 40000
  # JVM options for the optimizer process. The optimizer needs enough heap and
  # direct memory to execute PQ retraining + graph-merge in a single JVM:
  #   -Xms/-Xmx: heap for PQ codebook training, intermediate graph structures,
  #     and the jvector merge working set. For gist1m M=16 (1M × 960-dim) the
  #     PQ training reservoir alone requires ~350 MB; the graph merge adds
  #     several more GB of working set. 6 g is the minimum for gist1m-class
  #     merges without OOMKill (issue #499 Bug 1).
  #   --add-modules jdk.incubator.vector: enables Panama Vector API for
  #     jvector's SIMD distance kernels.
  #   -XX:MaxDirectMemorySize: cap for non-Netty JVM direct buffers.
  #   -Djava.net.preferIPv4Stack=true: avoids IPv6 resolution delays in
  #     Kubernetes pods that only have IPv4 routes.
  # Default: 6 g heap + 1 g direct. Override per-bench if the input segments
  # are larger (e.g. bigann-100M M=16 needs at least 12 g heap).
  javaOpts: "-Xms6g -Xmx6g -Djava.net.preferIPv4Stack=true --add-modules jdk.incubator.vector -XX:MaxDirectMemorySize=1g"
  javaOptsExtra: ""
  loggingProperties: ""
  extraConfig: {}
  # Local PVC used to stage merge-intermediate files before they are uploaded
  # to remote storage. Sized for the largest concurrent merge: typically a few
  # times maxBytes above. Mounted at /opt/herddb/optimizer-tmp.
  storage:
    tmp:
      size: 20Gi
      storageClass: ""
  pdb:
    enabled: false
    minAvailable: 0
  # Memory sized to hold the optimizer's heap (javaOpts -Xmx) plus JVM
  # non-heap overhead (~1 GiB for code-cache, metaspace, thread stacks)
  # plus direct memory (MaxDirectMemorySize). For the default 6 g heap
  # + 1 g direct: 6 + 1 + 1 = 8 GiB container (issue #499 Bug 1).
  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "2"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Tools pod — sleep + pre-configured CLI for kubectl exec.
# Runs as a StatefulSet with a persistent PVC for vector benchmark datasets.
tools:
  enabled: true
  # JVM options for the CLI (defaults to lightweight settings)
  javaOpts: ""
  # Port for the embedded VectorBench admin HTTP API (GET /status,
  # POST /ingestion/config/ingest-max-ops, etc.).  Passed to the JVM
  # as -Dvectorbench.admin.port=<N> via VECTORBENCH_ADMIN_PORT env var.
  # Set to "0" or a negative value to disable the admin API.
  adminPort: "8080"
  # PodDisruptionBudget — prevents voluntary node evictions (e.g. GKE Autopilot
  # scale-down) from killing the tools pod mid-benchmark. Enabled by default
  # when tools is enabled. Set to false only for short-lived / disposable runs.
  pdb:
    enabled: true
    minAvailable: 1
  gcs:
    # Kubernetes Secret containing GCS HMAC credentials (keys: S3_ACCESS_KEY, S3_SECRET_KEY).
    # When set, the tools pod can download datasets from gs:// URLs using the S3-compatible API.
    credentialsSecret: ""
    # Optional default datasets bucket. When set, the tools pod gets
    # VECTORBENCH_DATASETS_BUCKET=gs://<name> so scripts and the
    # benchmark can default custom --dataset-url prefixes without
    # hard-coding the bucket name.
    datasetsBucket: ""
  storage:
    datasets:
      size: 30Gi
      storageClass: ""
      # When set, uses a hostPath volume instead of a PVC.
      # The path must exist on the Kubernetes node (or the k3s container).
      hostPath: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.5"
    limits:
      memory: "256Mi"
      cpu: "0.5"


# Optional Prometheus instance for scraping HerdDB metrics.
prometheus:
  enabled: false
  image:
    repository: prom/prometheus
    tag: "v2.53.0"
  port: 9090
  storage:
    size: 10Gi
    storageClass: ""
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.5"
    limits:
      memory: "512Mi"
      cpu: "0.5"

# Optional Grafana instance with pre-provisioned HerdDB dashboards.
grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: "11.1.0"
  port: 3000
  # PodDisruptionBudget — see server.pdb above. Disabled by default; enable in
  # production / long-running benchmarks (see issue #332).
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "0.25"
    limits:
      memory: "256Mi"
      cpu: "0.25"
