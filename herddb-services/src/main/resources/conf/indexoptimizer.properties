# IndexOptimizer service configuration.
#
# The index-optimizer is a singleton service per HerdDB cluster (Helm
# replicas: 1) that scans the segment registry in ZooKeeper and merges
# small/tombstoned vector index segments out-of-process. The IS skips
# in-process compaction when indexing.optimizer.enabled=true.

# ZooKeeper connection string (must match the HerdDB cluster ZK).
indexoptimizer.zookeeper.address=localhost:2181

# ZooKeeper session timeout in milliseconds.
indexoptimizer.zookeeper.session.timeout=40000

# ZooKeeper base path (must match server.zookeeper.path).
indexoptimizer.zookeeper.path=/herd

# Tablespace UUID this optimizer manages. Required.
# indexoptimizer.tablespace.uuid=...

# Polling interval for the registry scan, in milliseconds.
indexoptimizer.interval.ms=300000

# Merge policy: minimum mergeable segment count to consider a run.
indexoptimizer.merge.min.count=4

# Hard ceiling on segment count before a merge is forced.
indexoptimizer.merge.max.count=200

# Minimum total size of mergeable segments to consider a run, in bytes.
indexoptimizer.merge.min.bytes=268435456

# Per-run cap on input segment bytes.
indexoptimizer.merge.max.bytes=1073741824

# K-way single-pass merge (issue #524).
# When >= 2, the merge policy picks up to this many sub-target segments per
# cycle and merges them in one pass, bypassing indexoptimizer.merge.max.bytes.
# This collapses N segments into one merge round (O(N) work) instead of
# sequential 2-way rounds (O(N^2) work). Set to 0 for legacy byte-cap behaviour.
# Default: 8
#indexoptimizer.merge.kway.max=8

# Retention window for DEPRECATED segments before transitioning to DELETED.
indexoptimizer.retention.ms=600000
